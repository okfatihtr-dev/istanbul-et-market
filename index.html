<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Учёт Системы</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1a1d23;--bg2:#22262f;--bg3:#2a2f3a;--border:#363c4a;
  --accent:#f59e0b;--accent2:#f87171;--accent3:#34d399;
  --text:#f0f2f7;--text2:#b0bac8;--text3:#7a8499;
  --card:#22262f;--hover:#2e3342;
  --win-title:#1a1d23;--win-menu:#22262f;--win-menu-hover:#363c4a;
  --win-menu-active:#f59e0b;
}
.light{
  --bg:#f0f2f7;--bg2:#ffffff;--bg3:#e8eaf0;--border:#d0d5e0;
  --text:#1a1e2e;--text2:#4a5568;--text3:#8892a4;
  --card:#ffffff;--hover:#f5f7fc;
  --win-title:#e0e3ea;--win-menu:#f0f2f7;--win-menu-hover:#dde0e8;
  --win-menu-active:#f59e0b;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;transition:background .3s,color .3s;}

/* ── WINDOWS TITLE BAR ── */
.win-titlebar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--win-title);border-bottom:1px solid var(--border);
  padding:0 12px;height:32px;user-select:none;position:sticky;top:0;z-index:200;
}
.win-titlebar-left{display:flex;align-items:center;gap:8px;}
.win-titlebar-icon{font-size:14px;}
.win-titlebar-text{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.02em;}
.win-titlebar-status{font-size:9px;color:var(--text3);margin-left:6px;}
.win-titlebar-controls{display:flex;align-items:center;gap:0;}
.win-ctrl-btn{
  width:36px;height:32px;border:none;background:transparent;
  cursor:pointer;font-size:13px;color:var(--text2);
  display:flex;align-items:center;justify-content:center;transition:background .15s;
}
.win-ctrl-btn:hover{background:var(--hover);}
.win-ctrl-btn.close:hover{background:#e81123;color:#fff;}

/* ── WINDOWS MENU BAR (Ribbon-style) ── */
.win-menubar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--win-menu);border-bottom:1px solid var(--border);
  padding:0 8px;height:40px;position:sticky;top:32px;z-index:190;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.win-menu-left{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;}
.win-menu-right{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-left:8px;}
.win-menu-item{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:4px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--text2);
  white-space:nowrap;transition:all .15s;border:1px solid transparent;
  background:transparent;
}
.win-menu-item:hover{background:var(--win-menu-hover);color:var(--text);border-color:var(--border);}
.win-menu-item.active{
  background:var(--bg);color:var(--accent);
  border-color:var(--border);font-weight:600;
  border-bottom:2px solid var(--accent);
}
.win-menu-item .menu-icon{font-size:14px;line-height:1;}
.win-menu-item .menu-label{font-size:12px;}

.win-menu-sep{width:1px;height:22px;background:var(--border);margin:0 4px;flex-shrink:0;}

/* ── RIBBON TOOLBAR (below menu for contextual actions) ── */
.win-ribbon{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:6px 16px;min-height:38px;position:sticky;top:72px;z-index:180;
  flex-wrap:wrap;gap:6px;
}
.win-ribbon-left{display:flex;align-items:center;gap:8px;}
.win-ribbon-left h2{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;}
.win-ribbon-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

/* ── USER CHIP (top right) ── */
.user-chip{
  display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;
  background:var(--bg3);border-radius:16px;cursor:default;border:1px solid var(--border);
}
.user-chip-avatar{
  width:24px;height:24px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#000;flex-shrink:0;
}
.user-chip-name{font-size:11px;font-weight:500;color:var(--text);}
.user-chip-role{font-size:9px;color:var(--text3);}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;min-height:100vh;}
.main{flex:1;display:flex;flex-direction:column;}
.content{padding:20px 24px;flex:1;max-width:1400px;margin:0 auto;width:100%;}

/* ── POINTS BAR (below ribbon, optional) ── */
.win-points-bar{
  display:flex;align-items:center;gap:6px;padding:4px 16px;
  background:var(--bg3);border-bottom:1px solid var(--border);
  font-size:10px;color:var(--text3);overflow-x:auto;
}
.win-point-badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;border-radius:4px;background:var(--bg2);
  border:1px solid var(--border);font-size:10px;color:var(--text2);white-space:nowrap;
}

/* ── REUSE ALL ORIGINAL COMPONENT STYLES ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;transition:all .2s;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#000;}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover:not(:disabled){background:var(--hover);}
.btn-danger{background:rgba(239,68,68,.1);color:var(--accent2);border:1px solid rgba(239,68,68,.2);}
.btn-success{background:rgba(16,185,129,.1);color:var(--accent3);border:1px solid rgba(16,185,129,.2);}
.theme-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;}
.stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.stat-value{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:700;}
.stat-value.y{color:var(--accent);}
.stat-value.g{color:var(--accent3);}
.stat-value.r{color:var(--accent2);}
.stat-value.b{color:#60a5fa;}
.stat-sub{font-size:10px;color:var(--text2);margin-top:4px;}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.table-card .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.table-head h3{font-size:13px;font-weight:600;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg3);}
thead th{padding:9px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;} thead th.num{text-align:right;}
tbody tr{border-top:1px solid var(--border);}
tbody tr:hover{background:var(--hover);}
tbody td{padding:10px 14px;font-size:13px;color:var(--text);vertical-align:middle;}
.txt-cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
thead th.num{text-align:right;}
.actions-cell{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-height:32px;}
.badge{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;}
.badge-y{background:rgba(245,158,11,.15);color:var(--accent);}
.badge-g{background:rgba(16,185,129,.15);color:var(--accent3);}
.badge-r{background:rgba(239,68,68,.15);color:var(--accent2);}
.badge-b{background:rgba(59,130,246,.15);color:#60a5fa;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:10px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.08em;}
.form-control{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .2s;} .form-control::placeholder{color:var(--text3);}
.form-control:focus{border-color:var(--accent);}
select.form-control option{background:var(--bg2);}
.section-title{font-family:'Unbounded',sans-serif;font-size:10px;font-weight:600;color:var(--text2);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:7px 14px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;background:var(--bg2);color:var(--text2);transition:all .2s;}
.tab:hover{color:var(--text);border-color:var(--accent);}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;}
.modal-body{padding:20px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);}
.close-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:13px;color:var(--text2);}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:14px;}
.alert-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--accent);}
.alert-success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--accent3);}
.alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--accent2);}
.profit-box{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(16,185,129,.02));border:1px solid rgba(16,185,129,.25);border-radius:12px;padding:20px;text-align:center;margin-bottom:18px;}
.profit-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;}
.profit-value{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:700;}
.profit-sub{font-size:10px;color:var(--text3);margin-top:4px;}
.bar-chart{display:flex;flex-direction:column;gap:10px;padding:14px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{font-size:11px;color:var(--text2);width:80px;flex-shrink:0;text-align:right;}
.bar-track{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .6s ease;}
.bar-val{font-size:11px;color:var(--text);width:90px;text-align:right;font-weight:500;}
.empty{text-align:center;padding:36px;color:var(--text3);font-size:13px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;}
.loading-screen p{color:var(--text3);font-size:13px;}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:36px;width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo h1{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;color:var(--accent);}
.login-logo p{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.1em;}
.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent3);margin-right:5px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.top-alert{position:fixed;top:16px;right:16px;z-index:999;min-width:260px;box-shadow:0 4px 20px rgba(0,0,0,.3);}

/* ── EXCEL GRID ── */
.grid-cell{
  width:100%;background:transparent;border:1px solid transparent;
  border-radius:4px;padding:4px 6px;font-size:12px;color:var(--text);
  font-family:'Inter',sans-serif;outline:none;transition:all .15s;
}
.grid-cell:hover{border-color:var(--border);background:var(--bg3);}
.grid-cell:focus{border-color:var(--accent);background:var(--bg2);box-shadow:0 0 0 2px rgba(245,158,11,.15);}
select.grid-cell{cursor:pointer;appearance:auto;}
tr:hover .grid-cell{border-color:var(--border);}
.exp-row-selected{background:rgba(245,158,11,.06)!important;}

/* ── MOBILE ── */
.hamburger{display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:18px;align-items:center;justify-content:center;}
/* Mobile menu overlay for top nav */
.mobile-menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;backdrop-filter:blur(2px);}
.mobile-menu-overlay.open{display:block;}
.mobile-menu-panel{
  display:none;position:fixed;top:32px;left:0;right:0;
  background:var(--bg2);border-bottom:2px solid var(--accent);
  z-index:260;padding:12px;max-height:80vh;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.mobile-menu-panel.open{display:block;}
.mobile-menu-panel .win-menu-item{
  padding:10px 14px;border-radius:8px;font-size:13px;width:100%;
}

/* ── STATUS BAR (bottom) ── */
.win-statusbar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);border-top:1px solid var(--border);
  padding:3px 16px;height:24px;font-size:10px;color:var(--text3);
  position:sticky;bottom:0;z-index:100;
}

@media(max-width:768px){
  .hamburger{display:flex;}
  .win-menubar .win-menu-left{display:none;}
  .win-menubar .win-menu-left.mobile-show{display:flex;flex-direction:column;position:fixed;top:72px;left:0;right:0;background:var(--bg2);z-index:260;padding:8px;border-bottom:2px solid var(--accent);box-shadow:0 8px 32px rgba(0,0,0,.4);}
  .win-menubar .win-menu-left.mobile-show .win-menu-item{width:100%;padding:10px 14px;}
  .win-menubar .win-menu-left.mobile-show .win-menu-sep{width:100%;height:1px;margin:4px 0;}
  .content{padding:14px;}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{padding:14px;}
  .stat-value{font-size:15px;}
  .point-tabs,.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
  .tab,.point-tab{flex-shrink:0;}
  .form-grid{grid-template-columns:1fr;}
  .modal{margin:8px;max-height:95vh;}
  .profit-box .profit-value{font-size:20px;}
  .btn{font-size:11px;padding:7px 12px;}
  .user-chip-name,.user-chip-role{display:none;}
  .win-ribbon-left h2{font-size:12px;}
}
@media(max-width:480px){
  .hide-mobile{display:none;}
  .stats-grid{grid-template-columns:1fr;}
  .win-ribbon-right .btn span{display:none;}
}

/* Hide old sidebar classes if any remain */
.sidebar{display:none!important;}
.sidebar-overlay{display:none!important;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://ejcsyiseajqvidrvnxbl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_euNwrhhUCWpF_q0jUHZmmw_I4Zbcd2X';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const POINTS = [
  {id:'mkr17',name:'17-й Микрорайон',short:'17 МКР'},
  {id:'mkr5', name:'5-й Микрорайон', short:'5 МКР'},
  {id:'baza', name:'База',           short:'База'},
  {id:'polf', name:'Полфабрикат',    short:'Полф.'},
  {id:'ofis', name:'Офис',           short:'Офис'},
];
const CATS = {
  mkr17:['Мясо','Курица','Баранина','Конина','Салаты','Полфабрикат','Маркет'],
  mkr5: ['Мясо','Курица','Баранина','Конина','Полфабрикат','Маркет'],
  baza: ['Мясо','Курица','Баранина','Конина'],
  polf: ['Полфабрикат'],
  ofis: [],
};
let EXP_TYPES_DEFAULT = ['Аренда','Зарплата','Электричество','Транспорт','Коммунальные','Уборка','Упаковка','Ремонт','Прочее'];
function getExpTypes(){
  try{ const s=localStorage.getItem('exp_types'); return s?JSON.parse(s):EXP_TYPES_DEFAULT; }
  catch{return EXP_TYPES_DEFAULT;}
}
function saveExpTypes(arr){
  localStorage.setItem('exp_types', JSON.stringify(arr));
}
const PAGE_TITLES = {dashboard:'Главная панель',entry:'Ввод данных',expenses:'Расходы / Зарплаты',bank:'Банк (Офис)',report:'Отчёт',users:'Пользователи',profile:'Мой профиль',staff:'Персонал / Зарплаты',cariler:'Карточки должников',targets:'Цели / Бюджет'};

function fmt(n){if(!n&&n!==0)return '—';return Number(n).toLocaleString('ru-KZ')+'₸';}
function fmtDate(d){
  if(!d) return '—';
  const s = String(d).trim();
  // Already DD.MM.YYYY
  if(/^\d{2}\.\d{2}\.\d{4}$/.test(s)) return s;
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    const [y,m,day] = s.slice(0,10).split('-');
    return `${day}.${m}.${y}`;
  }
  return s;
}
function today(){return new Date().toISOString().split('T')[0];}
function getLast(n){const d=[];for(let i=n-1;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);d.push(x.toISOString().split('T')[0]);}return d;}

// ─── STATE ─────────────────────────────────────────────────────────────────
let STATE = {
  theme: localStorage.getItem('theme')||'dark',
  user: null,
  page: 'dashboard',
  loading: true,
  dataLoaded: false,
  entries: [],
  expenses: [],
  salaries: [],
  bankTx: [],
  alert: null,
  alertTimer: null,
};

function setState(patch){
  Object.assign(STATE, patch);
  render();
}

function showAlert(type, msg){
  if(STATE.alertTimer) clearTimeout(STATE.alertTimer);
  const t = setTimeout(()=>setState({alert:null,alertTimer:null}), 3500);
  setState({alert:{type,msg}, alertTimer:t});
}

// ─── SUPABASE ───────────────────────────────────────────────────────────────
async function loadAll(){
  setState({dataLoaded:false});
  try{
    const [e,ex,sal,bk,staff,adv,salPay,tgtsRaw] = await Promise.all([
      sb.from('daily_entries').select('*').order('date',{ascending:false}),
      sb.from('expenses').select('*').order('date',{ascending:false}),
      sb.from('salaries').select('*').order('created_at',{ascending:false}),
      sb.from('bank_transactions').select('*').order('created_at',{ascending:false}),
      sb.from('staff').select('*'),
      sb.from('staff_advances').select('*'),
      sb.from('staff_salary_payments').select('*'),
      sb.from('targets').select('*'),
    ]);
    const tgts = {};
    (tgtsRaw.data||[]).forEach(row=>{
      if(!tgts[row.point_id]) tgts[row.point_id]={};
      tgts[row.point_id][row.metric] = row.value;
    });
    setState({entries:e.data||[], expenses:ex.data||[], salaries:sal.data||[], bankTx:bk.data||[],
      staffCache:staff.data||[], advancesCache:adv.data||[], salPayCache:salPay.data||[], targets:tgts,
      dataLoaded:true});
  }catch(err){
    setState({dataLoaded:true});
    showAlert('error','Ошибка загрузки: '+err.message);
  }
}

async function doLogin(login, password){
  const {data,error} = await sb.from('users').select('*').eq('login',login).eq('password',password).single();
  if(error||!data) throw new Error('Неверный логин или пароль');
  sessionStorage.setItem('uchet_user', JSON.stringify(data));
  setState({user:data});
  await loadAll();
}

  sessionStorage.removeItem('uchet_user');

}

}

function bindLogin(){
  document.getElementById('theme-btn-login')?.addEventListener('click',()=>setState({theme:STATE.theme==='dark'?'light':'dark'}));
  const btn = document.getElementById('login-btn');
  const errDiv = document.getElementById('login-err');
  async function tryLogin(){
    const login = document.getElementById('login-input').value.trim();
    const pass  = document.getElementById('pass-input').value;
    if(!login||!pass) return;
    btn.disabled=true; btn.textContent='Вход...';
    try{ await doLogin(login,pass); }
    catch(e){
      errDiv.innerHTML=`<div class="alert alert-error">${e.message}</div>`;
      btn.disabled=false; btn.textContent='Войти';
    }
  }
  btn?.addEventListener('click', tryLogin);
  document.getElementById('pass-input')?.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
}

    const ptCats = CATS[p.id]||[];

      ${partialData.length>0?`

        <span style="font-size:18px;">📝</span>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Продажи</div><div class="stat-value y">${fmt(totSales)}</div><div class="stat-sub">все точки</div></div>
      <div class="stat-card"><div class="stat-label">Закуп</div><div class="stat-value b">${fmt(totPurch)}</div><div class="stat-sub">поступления</div></div>

      <div class="stat-card"><div class="stat-label">Остаток</div><div class="stat-value g">${fmt(totRem)}</div><div class="stat-sub">склад</div></div>
    </div>
    <div class="section-title">Продажи по точкам</div>
    <div class="table-card"><div class="bar-chart">${bars||'<div class="empty">Нет данных</div>'}</div></div>

    <div class="table-card" style="margin-bottom:16px;">

let entryState = {pointId:'', date:today(), saving:false, modal:null, bulkMode:false, bulkData:{}, importMode:false, importData:[], importErrors:[]};

// ─── ENTRY GRID ───────────────────────────────────────────────────────────────
const entryGrid = {
  sortCol:'date', sortAsc:false,
  filters:{}, // {date, category}
  
  getRows(rows){
    let f=[...rows];
    Object.entries(this.filters).forEach(([col,val])=>{
      if(!val) return;
      if(col==='date') f=f.filter(e=>e.date?.startsWith(val));
      else f=f.filter(e=>String(e[col]||'').toLowerCase().includes(val.toLowerCase()));
    });
    const col=this.sortCol, asc=this.sortAsc;
    f.sort((a,b)=>{
      let va=a[col]||'', vb=b[col]||'';
      if(['received','sold','remaining'].includes(col)){va=Number(va);vb=Number(vb);}
      return va<vb?(asc?-1:1):va>vb?(asc?1:-1):0;
    });
    return f;
  },

  sortBy(col){
    if(this.sortCol===col) this.sortAsc=!this.sortAsc;
    else{this.sortCol=col;this.sortAsc=true;}
    render();
  },

  async updateCell(id,field,value){
    const update={};
    update[field]=['received','sold','remaining'].includes(field)?parseFloat(value)||0:value;
    STATE.entries=STATE.entries.map(e=>e.id===id?{...e,...update}:e);
    render();
    const {error}=await sb.from('daily_entries').update({...update,updated_at:new Date().toISOString()}).eq('id',id);
    if(error) showAlert('error','Ошибка: '+error.message);
  },

  async deleteRow(id){
    if(!confirm('Удалить строку?')) return;
    STATE.entries=STATE.entries.filter(e=>e.id!==id);
    render();
    await sb.from('daily_entries').delete().eq('id',id);
  },
};

const expGrid = {
  sortCol:'date', sortAsc:false,
  selected: new Set(),
  activeFilter:'', filterVal:'',
  filters: {}, // {col: value} - multiple column filters

  getRows(rows){
    let f=[...rows];
    // Apply all active filters
    Object.entries(this.filters).forEach(([col,val])=>{
      if(!val) return;
      if(col==='date') f=f.filter(e=>e.date?.startsWith(val));
      else if(col==='amount_min') f=f.filter(e=>Number(e.amount||0)>=Number(val));
      else if(col==='amount_max') f=f.filter(e=>Number(e.amount||0)<=Number(val));
      else f=f.filter(e=>String(e[col]||'').toLowerCase().includes(val.toLowerCase()));
    });
    const col=this.sortCol, asc=this.sortAsc;
    f.sort((a,b)=>{
      let va=a[col]||'', vb=b[col]||'';
      if(col==='amount'){va=Number(va);vb=Number(vb);}
      return va<vb?(asc?-1:1):va>vb?(asc?1:-1):0;
    });
    return f;
  },

  sortBy(col){
    if(this.sortCol===col) this.sortAsc=!this.sortAsc;
    else{this.sortCol=col;this.sortAsc=true;}
    render();
  },

  toggleFilter(col){
    if(this.activeFilter===col){this.activeFilter='';this.filterVal='';}
    else{this.activeFilter=col;this.filterVal='';}
    render();
  },

  toggleSelect(id,checked){
    if(checked) this.selected.add(id);
    else this.selected.delete(id);
  },

  selectAll(checked){
    const visible = this.getRows(STATE.expenses.filter(e=>e.point_id===expState.pointId));
    if(checked) visible.forEach(e=>this.selected.add(e.id));
    else this.selected.clear();
    render();
  },

  async updateCell(id,field,value){
    const update={};
    update[field]=field==='amount'?parseFloat(value)||0:value;
    STATE.expenses=STATE.expenses.map(e=>e.id===id?{...e,...update}:e);
    render();
    const {error}=await sb.from('expenses').update(update).eq('id',id);
    if(error) showAlert('error','Ошибка: '+error.message);
  },

  async deleteRow(id){
    if(!confirm('Удалить строку?')) return;
    STATE.expenses=STATE.expenses.filter(e=>e.id!==id);
    this.selected.delete(id);
    render();
    await sb.from('expenses').delete().eq('id',id);
  },

  async deleteSelected(){
    const ids=[...this.selected];
    if(!ids.length) return;
    if(!confirm(`Удалить ${ids.length} строк?`)) return;
    STATE.expenses=STATE.expenses.filter(e=>!ids.includes(e.id));
    this.selected.clear();
    render();
    for(const id of ids) await sb.from('expenses').delete().eq('id',id);
    showAlert('success',`Удалено ${ids.length} строк`);
  },
};

let bankFilter = {dateFrom:'', dateTo:'', category:'', counterpart:'', firm:'', txType:''};

// ─── BANK GRID ───────────────────────────────────────────────────────────────
const bankGrid = {
  sortCol:'date', sortAsc:false,
  selected: new Set(),
  activeFilter:'', filterVal:'',
  filters: {},

  getRows(rows){
    let f=[...rows];
    Object.entries(this.filters).forEach(([col,val])=>{
      if(!val) return;
      if(col==='debit_min') f=f.filter(t=>Number(t.debit||0)>=Number(val));
      else if(col==='debit_max') f=f.filter(t=>Number(t.debit||0)<=Number(val));
      else if(col==='credit_min') f=f.filter(t=>Number(t.credit||0)>=Number(val));
      else if(col==='is_expense') f=f.filter(t=>val==='yes'?t.is_expense:!t.is_expense);
      else f=f.filter(t=>String(t[col]||'').toLowerCase().includes(val.toLowerCase()));
    });
    const col=this.sortCol, asc=this.sortAsc;
    f.sort((a,b)=>{
      let va=a[col]||'', vb=b[col]||'';
      if(col==='debit'||col==='credit'){va=Number(va);vb=Number(vb);}
      return va<vb?(asc?-1:1):va>vb?(asc?1:-1):0;
    });
    return f;
  },

  sortBy(col){
    if(this.sortCol===col) this.sortAsc=!this.sortAsc;
    else{this.sortCol=col;this.sortAsc=true;}
    render();
  },

  toggleFilter(col){
    if(this.activeFilter===col){this.activeFilter='';this.filterVal='';}
    else{this.activeFilter=col;this.filterVal='';}
    render();
  },

  toggleSelect(id,checked){
    if(checked) this.selected.add(id);
    else this.selected.delete(id);
  },

  selectAll(checked,rows){
    if(checked) rows.forEach(t=>this.selected.add(t.id));
    else this.selected.clear();
    render();
  },

  async updateCell(id,field,value){
    const update={};
    update[field]=value===true||value===false?value:value;
    STATE.bankTx=STATE.bankTx.map(t=>t.id===id?{...t,...update}:t);
    render();
    await sb.from('bank_transactions').update(update).eq('id',id);
  },

  async deleteSelected(){
    const ids=[...this.selected];
    if(!ids.length) return;
    if(!confirm(`Удалить ${ids.length} записей?`)) return;
    STATE.bankTx=STATE.bankTx.filter(t=>!ids.includes(t.id));
    this.selected.clear();
    render();
    for(const id of ids) await sb.from('bank_transactions').delete().eq('id',id);
    showAlert('success',`Удалено ${ids.length}`);
  },
};

// ─── REPORT ──────────────────────────────────────────────────────────────────
let reportState = {pointId:'', days:'15', tab:'report'}; // tab: report | compare

function renderReport(accessPoints){
  const editable = accessPoints.filter(p=>p.id!=='ofis');
  if(!reportState.pointId) reportState.pointId = 'ALL';
  const dates = getLast(Number(reportState.days));
  const isAll = reportState.pointId === 'ALL';

  // Per-point summary for consolidated view
  const pointSummary = editable.map(p=>{
    const pCats = CATS[p.id]||[];
    const pEntries = STATE.entries.filter(e=>e.point_id===p.id&&dates.includes(e.date));
    const pS = pEntries.reduce((s,e)=>s+Number(e.sold||0),0);
    const pR = pEntries.reduce((s,e)=>s+Number(e.received||0),0);
    const pRem = pCats.map(cat=>{
      const last = pEntries.filter(e=>e.category===cat).sort((a,b)=>b.date.localeCompare(a.date))[0];
      return last?Number(last.remaining||0):0;
    }).reduce((s,v)=>s+v,0);
    const pExp = STATE.expenses.filter(e=>e.point_id===p.id&&dates.includes(e.date)).reduce((s,e)=>s+Number(e.amount||0),0);
    const pSal = STATE.salaries.filter(s=>s.point_id===p.id).reduce((s,e)=>s+Number(e.amount||0),0);
    const pCosts = pExp+pSal;
    const pProfit = pS-pR-pCosts+pRem;
    const pMargin = pS>0?((pProfit/pS)*100).toFixed(1):'0.0';
    return {p, pS, pR, pRem, pCosts, pExp, pSal, pProfit, pMargin};
  });

  // Category data — for single point or all points merged
  const activePts = isAll ? editable : editable.filter(p=>p.id===reportState.pointId);
  const allCats = [...new Set(activePts.flatMap(p=>CATS[p.id]||[]))];
  const cats = isAll ? allCats : (CATS[reportState.pointId]||[]);

  const catData = cats.map(cat=>{
    const ce = STATE.entries.filter(e=>activePts.some(p=>p.id===e.point_id)&&e.category===cat&&dates.includes(e.date));
    const totR = ce.reduce((s,e)=>s+Number(e.received||0),0);
    const totS = ce.reduce((s,e)=>s+Number(e.sold||0),0);
    const lastRem = activePts.reduce((sum,p)=>{
      const last = ce.filter(e=>e.point_id===p.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
      return sum+(last?Number(last.remaining||0):0);
    },0);
    return {cat, totR, totS, lastRem, count:ce.length};
  });

  const totSold   = catData.reduce((s,c)=>s+c.totS,0);
  const totBought = catData.reduce((s,c)=>s+c.totR,0);
  const totRem    = catData.reduce((s,c)=>s+c.lastRem,0);
  const ptExp = isAll
    ? STATE.expenses.filter(e=>dates.includes(e.date)&&editable.some(p=>p.id===e.point_id))
    : STATE.expenses.filter(e=>e.point_id===reportState.pointId&&dates.includes(e.date));
  // Salary costs come from staff module (advances + payments)
  // Load from Supabase synchronously via pre-loaded data
  const ptStaffIds = (STATE.staffCache||[])
    .filter(emp=>isAll ? editable.some(p=>p.id===emp.point_id) : emp.point_id===reportState.pointId)
    .map(emp=>emp.id);
  const ptAdvances = (STATE.advancesCache||[])
    .filter(a=>ptStaffIds.includes(a.employee_id)&&dates.includes(a.date));
  const ptSalPayments = (STATE.salPayCache||[])
    .filter(p=>ptStaffIds.includes(p.employee_id)&&dates.includes(p.date));
  const totExp = ptExp.reduce((s,e)=>s+Number(e.amount||0),0);
  const totSal = [...ptAdvances,...ptSalPayments].reduce((s,e)=>s+Number(e.amount||0),0);
  const totCosts = totExp+totSal;
  const profit = totSold-totBought-totCosts+totRem;
  const marginPct = totSold>0 ? ((profit/totSold)*100).toFixed(1) : '0.0';
  const costPct   = totSold>0 ? (((totBought+totCosts)/totSold)*100).toFixed(1) : '0.0';

  const tabs = [
    `<div class="tab ${isAll?'active':''}" data-report-point="ALL">🌐 Все точки</div>`,
    ...editable.map(p=>`<div class="tab ${reportState.pointId===p.id&&!isAll?'active':''}" data-report-point="${p.id}">${p.name}</div>`)
  ].join('');

  // Consolidated point-by-point table (only shown for ALL)
  const consolidatedRows = isAll ? pointSummary.map(({p,pS,pR,pRem,pCosts,pProfit,pMargin})=>`
    <tr>
      <td class="txt-cut"><span class="badge badge-y">${p.name}</span></td>
      <td class="num" style="color:#60a5fa;font-weight:500;">${fmt(pR)}</td>
      <td class="num" style="color:var(--accent);font-weight:500;">${fmt(pS)}</td>
      <td class="num" style="color:var(--accent3);">${fmt(pRem)}</td>
      <td class="num" style="color:var(--accent2);">${fmt(pCosts)}</td>
      <td class="num" style="color:${Number(pProfit)>=0?'var(--accent3)':'var(--accent2)'};font-weight:700;">${fmt(pProfit)}</td>
      <td class="num" style="color:${Number(pMargin)>=0?'var(--accent3)':'var(--accent2)'};font-weight:700;">${pMargin}%</td>
    </tr>`).join('') : '';

  const consolidatedSection = isAll ? `
    <div class="section-title">Сводная таблица по точкам</div>
    <div class="table-card" style="margin-bottom:20px;">
      <div class="table-head"><h3>📍 Все точки — сравнение</h3></div>
      <div class="table-scroll" style="overflow-x:auto;">
      <table style="table-layout:fixed;min-width:650px;width:100%;"><colgroup><col style="width:25%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:10%"></colgroup><thead><tr><th>Точка</th><th class="num">Закуп</th><th class="num">Продажа</th><th class="num">Остаток</th><th class="num">Расходы</th><th class="num">Прибыль</th><th class="num">Рент-сть</th></tr></thead>
        <tbody>
          ${consolidatedRows}
          <tr style="background:var(--bg3);font-weight:700;border-top:2px solid var(--accent);">
            <td>ИТОГО ВСЕ</td>
            <td class="num" style="color:#60a5fa;">${fmt(totBought)}</td>
            <td class="num" style="color:var(--accent);">${fmt(totSold)}</td>
            <td class="num" style="color:var(--accent3);">${fmt(totRem)}</td>
            <td class="num" style="color:var(--accent2);">${fmt(totCosts)}</td>
            <td class="num" style="color:${profit>=0?'var(--accent3)':'var(--accent2)'};">${fmt(profit)}</td>
            <td class="num" style="color:${profit>=0?'var(--accent3)':'var(--accent2)'};">${marginPct}%</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="table-card" style="margin-bottom:20px;">
      <div class="table-head"><h3>📊 Продажи по точкам</h3></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
        ${pointSummary.sort((a,b)=>b.pS-a.pS).map(({p,pS})=>{
          const maxS=Math.max(...pointSummary.map(x=>x.pS),1);
          const pct=totSold>0?((pS/totSold)*100).toFixed(1):'0';
          return `<div style="display:flex;align-items:center;gap:10px;">
            <div style="width:110px;font-size:12px;color:var(--text);flex-shrink:0;">${p.name}</div>
            <div style="flex:1;height:12px;background:var(--bg3);border-radius:6px;overflow:hidden;">
              <div style="height:100%;width:${(pS/maxS)*100}%;background:var(--accent);border-radius:6px;"></div>
            </div>
            <div style="width:45px;text-align:right;font-size:11px;color:var(--accent);font-weight:600;">${pct}%</div>
            <div style="width:110px;text-align:right;font-size:12px;color:var(--text2);">${fmt(pS)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="table-card" style="margin-bottom:20px;">
      <div class="table-head"><h3>💹 Прибыль по точкам</h3></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
        ${pointSummary.sort((a,b)=>b.pProfit-a.pProfit).map(({p,pProfit,pMargin})=>{
          const maxP=Math.max(...pointSummary.map(x=>Math.abs(x.pProfit)),1);
          const isPos=pProfit>=0;
          return `<div style="display:flex;align-items:center;gap:10px;">
            <div style="width:110px;font-size:12px;color:var(--text);flex-shrink:0;">${p.name}</div>
            <div style="flex:1;height:12px;background:var(--bg3);border-radius:6px;overflow:hidden;">
              <div style="height:100%;width:${(Math.abs(pProfit)/maxP)*100}%;background:${isPos?'var(--accent3)':'var(--accent2)'};border-radius:6px;"></div>
            </div>
            <div style="width:45px;text-align:right;font-size:11px;color:${isPos?'var(--accent3)':'var(--accent2)'};font-weight:600;">${pMargin}%</div>
            <div style="width:110px;text-align:right;font-size:12px;color:${isPos?'var(--accent3)':'var(--accent2)'};">${fmt(pProfit)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  ` : '';

  const catRows = catData.map(c=>`<tr>
    <td><b>${c.cat}</b></td>
    <td style="color:#60a5fa;">${fmt(c.totR)}</td>
    <td style="color:var(--accent);">${fmt(c.totS)}</td>
    <td style="color:var(--accent3);">${fmt(c.lastRem)}</td>
    <td><span class="badge badge-b">${c.count}</span></td>
  </tr>`).join('');

  const empMap = {};
  (STATE.staffCache||[]).forEach(emp=>{ empMap[emp.id]=emp.name; });

  const expRows = [
    ...ptExp.map(e=>`<tr><td>${fmtDate(e.date)}</td><td><span class="badge badge-r">${e.type}</span></td><td class="num" style="color:var(--accent2);">${fmt(e.amount)}</td><td class="txt-cut" style="color:var(--text3);">${e.description||'—'}</td></tr>`),
    ...ptAdvances.map(a=>`<tr><td>${fmtDate(a.date)}</td><td><span class="badge badge-r">Аванс</span></td><td class="num" style="color:var(--accent2);">${fmt(a.amount)}</td><td class="txt-cut" style="color:var(--text3);">${empMap[a.employee_id]||'—'}</td></tr>`),
    ...ptSalPayments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td><span class="badge badge-r">Зарплата</span></td><td class="num" style="color:var(--accent2);">${fmt(p.amount)}</td><td class="txt-cut" style="color:var(--text3);">${empMap[p.employee_id]||'—'}</td></tr>`),
  ].join('');

  // Store for export buttons
  window._lastReportData = {catData,totSold,totBought,totRem,totExp,totSal,totCosts,profit,dates,
    pointId:reportState.pointId,
    pointSummary:pointSummary.map(x=>({name:x.p.name,pS:x.pS,pR:x.pR,pRem:x.pRem,pCosts:x.pCosts,pProfit:x.pProfit,pMargin:x.pMargin}))
  };

  // Comparison data (current month vs previous month)
  const now = new Date();
  const curMonth  = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const prevDate  = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevMonth = `${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,'0')}`;
  
  function getMonthData(month, ptIds){
    const mDates = STATE.entries.filter(e=>e.date.startsWith(month)).map(e=>e.date);
    const uniq = [...new Set(mDates)];
    const mEntries = STATE.entries.filter(e=>ptIds.includes(e.point_id)&&e.date.startsWith(month));
    const mExp = STATE.expenses.filter(e=>ptIds.includes(e.point_id)&&e.date.startsWith(month));
    const mStaffIds = (STATE.staffCache||[]).filter(emp=>ptIds.includes(emp.point_id)).map(e=>e.id);
    const mSal = [...(STATE.advancesCache||[]),...(STATE.salPayCache||[])]
      .filter(x=>mStaffIds.includes(x.employee_id)&&x.date?.startsWith(month));
    const sold = mEntries.reduce((s,e)=>s+Number(e.sold||0),0);
    const bought = mEntries.reduce((s,e)=>s+Number(e.received||0),0);
    const allCatsM = [...new Set(activePts.flatMap(p=>CATS[p.id]||[]))];
    const rem = allCatsM.reduce((total,cat)=>{
      const last = mEntries.filter(e=>e.category===cat).sort((a,b)=>b.date.localeCompare(a.date))[0];
      return total+(last?Number(last.remaining||0):0);
    },0);
    const exp = mExp.reduce((s,e)=>s+Number(e.amount||0),0);
    const sal = mSal.reduce((s,e)=>s+Number(e.amount||0),0);
    const profit = sold-bought-(exp+sal)+rem;
    return {sold,bought,rem,exp:exp+sal,profit, days:uniq.length};
  }

  const ptIds = activePts.map(p=>p.id);
  const curData  = getMonthData(curMonth,  ptIds);
  const prevData = getMonthData(prevMonth, ptIds);

  function diff(cur,prev){
    if(!prev) return null;
    const pct = ((cur-prev)/Math.abs(prev||1)*100).toFixed(1);
    const up = cur>=prev;
    return `<span style="font-size:11px;color:${up?'var(--accent3)':'var(--accent2)'};">
      ${up?'▲':'▼'} ${Math.abs(pct)}%
    </span>`;
  }

  return `
    <div class="tabs" style="margin-bottom:16px;">
      <div class="tab ${reportState.tab==='report'?'active':''}" onclick="reportState.tab='report';render();">📊 Отчёт</div>
      <div class="tab ${reportState.tab==='compare'?'active':''}" onclick="reportState.tab='compare';render();">📈 Сравнение месяцев</div>
    </div>

    ${reportState.tab==='compare'?`
    <div class="section-title">Сравнение: ${curMonth} vs ${prevMonth}</div>
    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-scroll"><table style="table-layout:fixed;width:100%;">
        <colgroup><col style="width:22%"><col style="width:19%"><col style="width:19%"><col style="width:16%"><col style="width:24%"></colgroup>
        <thead><tr><th>Показатель</th><th class="num">${prevMonth}</th><th class="num">${curMonth}</th><th class="num">Изм.</th><th class="num">Тренд</th></tr></thead>
        <tbody>
          <tr><td><b>Продажа</b></td><td class="num" style="color:var(--accent);">${fmt(prevData.sold)}</td><td class="num" style="color:var(--accent);">${fmt(curData.sold)}</td><td class="num">${fmt(curData.sold-prevData.sold)}</td><td class="num">${diff(curData.sold,prevData.sold)||'—'}</td></tr>
          <tr><td><b>Закуп</b></td><td class="num" style="color:#60a5fa;">${fmt(prevData.bought)}</td><td class="num" style="color:#60a5fa;">${fmt(curData.bought)}</td><td class="num">${fmt(curData.bought-prevData.bought)}</td><td class="num">${diff(curData.bought,prevData.bought)||'—'}</td></tr>
          <tr><td><b>Остаток</b></td><td class="num" style="color:var(--accent3);">${fmt(prevData.rem)}</td><td class="num" style="color:var(--accent3);">${fmt(curData.rem)}</td><td class="num">${fmt(curData.rem-prevData.rem)}</td><td class="num">${diff(curData.rem,prevData.rem)||'—'}</td></tr>
          <tr><td><b>Расходы</b></td><td class="num" style="color:var(--accent2);">${fmt(prevData.exp)}</td><td class="num" style="color:var(--accent2);">${fmt(curData.exp)}</td><td class="num">${fmt(curData.exp-prevData.exp)}</td><td class="num">${diff(curData.exp,prevData.exp)||'—'}</td></tr>
          <tr style="background:var(--bg3);font-weight:700;"><td><b>Прибыль</b></td>
            <td class="num" style="color:${prevData.profit>=0?'var(--accent3)':'var(--accent2)'};">${fmt(prevData.profit)}</td>
            <td class="num" style="color:${curData.profit>=0?'var(--accent3)':'var(--accent2)'};">${fmt(curData.profit)}</td>
            <td class="num">${fmt(curData.profit-prevData.profit)}</td>
            <td class="num">${diff(curData.profit,prevData.profit)||'—'}</td>
          </tr>
        </tbody>
      </table></div>
    </div>

    ${isAll?`
    <div class="section-title">По точкам — сравнение</div>
    ${editable.map(p=>{
      const cur  = getMonthData(curMonth,  [p.id]);
      const prev = getMonthData(prevMonth, [p.id]);
      return `<div class="table-card" style="margin-bottom:12px;">
        <div class="table-head"><h3>📍 ${p.name}</h3></div>
        <div style="padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;">
          <div class="stat-card" style="padding:12px;">

function exportExcel(d){
  const isAll = d.pointId==='ALL';
  const pt = isAll ? 'Все точки' : (POINTS.find(p=>p.id===d.pointId)?.name||d.pointId);
  const rows = [
    ['ISTANBUL ET MARKET — Отчёт',pt,'Период',`${d.dates[0]} — ${d.dates[d.dates.length-1]}`],[],
  ];
  if(isAll && d.pointSummary){
    rows.push(['СВОДКА ПО ТОЧКАМ']);
    rows.push(['Точка','Закуп','Продажа','Остаток','Расходы','Прибыль','Рент-сть %']);
    d.pointSummary.forEach(p=>rows.push([p.name,p.pR,p.pS,p.pRem,p.pCosts,p.pProfit,p.pMargin+'%']));
    rows.push([]);
  }
  rows.push(['КАТЕГОРИИ']);
  rows.push(['Категория','Закуп','Продажа','Остаток','Дней','Рентабельность %']);
  d.catData.forEach(c=>rows.push([c.cat,c.totR,c.totS,c.lastRem,c.count,c.totS>0?(((c.totS-c.totR)/c.totS)*100).toFixed(1)+'%':'—']));
  rows.push([]);
  rows.push(['Итого Продажа',d.totSold],['Итого Закуп',d.totBought],['Итого Остаток',d.totRem],
    ['Операц. расходы',d.totExp],['Зарплаты',d.totSal],['Итого расходы',d.totCosts]);
  rows.push([],['ПРИБЫЛЬ',d.profit],['Рентабельность %',d.totSold>0?((d.profit/d.totSold)*100).toFixed(1)+'%':'0%']);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Отчёт');
  XLSX.writeFile(wb,`Otchet_${d.pointId}_${d.dates[0]}.xlsx`);
}

function bindEvents(accessPoints){
  // Hamburger menu (mobile)
  document.getElementById('hamburger-btn')?.addEventListener('click',()=>{
    const ml = document.getElementById('win-menu-left');
    const ov = document.getElementById('mobile-menu-overlay');
    ml?.classList.toggle('mobile-show');
    ov?.classList.toggle('open');
  });
  document.getElementById('mobile-menu-overlay')?.addEventListener('click',()=>{
    document.getElementById('win-menu-left')?.classList.remove('mobile-show');
    document.getElementById('mobile-menu-overlay')?.classList.remove('open');
  });
  // Close mobile menu on nav click
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>{
      document.getElementById('win-menu-left')?.classList.remove('mobile-show');
      document.getElementById('mobile-menu-overlay')?.classList.remove('open');
    });
  });

  // Backup / Restore
  document.getElementById('backup-btn')?.addEventListener('click', downloadBackup);
  document.getElementById('restore-file')?.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) restoreBackup(file);
    e.target.value='';
  });

  // Theme
  document.getElementById('theme-btn')?.addEventListener('click',()=>setState({theme:STATE.theme==='dark'?'light':'dark'}));
  // Refresh
  document.getElementById('refresh-btn')?.addEventListener('click',()=>loadAll());
  // Logout
  document.getElementById('logout-btn')?.addEventListener('click',doLogout);
  // Nav
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>setState({page:el.dataset.page}));
  });

  // Bulk save
  document.getElementById('bulk-save-btn')?.addEventListener('click', async()=>{
    const cats = CATS[entryState.pointId]||[];
    const toSave = cats.filter(cat=>entryState.bulkData[cat]&&
      Object.values(entryState.bulkData[cat]).some(v=>v!==''));
    if(toSave.length===0){showAlert('error','Нет данных для сохранения');return;}
    const btn=document.getElementById('bulk-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    let saved=0, errors=0;
    for(const cat of toSave){
      const bd = entryState.bulkData[cat];
      const existing = STATE.entries.find(e=>e.point_id===entryState.pointId&&e.date===entryState.date&&e.category===cat);
      const data = {
        point_id:entryState.pointId, date:entryState.date, category:cat,
        received:Number(bd.received||existing?.received||0),
        sold:Number(bd.sold||existing?.sold||0),
        remaining:Number(bd.remaining||existing?.remaining||0),
        user_id:STATE.user.id
      };
      let err;
      if(existing){
        const r=await sb.from('daily_entries').update({received:data.received,sold:data.sold,remaining:data.remaining,updated_at:new Date().toISOString()}).eq('id',existing.id);
        err=r.error;
      } else {
        const r=await sb.from('daily_entries').insert(data);
        err=r.error;
      }
      if(err) errors++;
      else saved++;
    }
    if(errors>0) showAlert('error',`Ошибок: ${errors}, сохранено: ${saved}`);
    else showAlert('success',`Сохранено ${saved} категорий!`);
    entryState.bulkMode=false;
    entryState.bulkData={};
    await loadAll();
  });

  // Entry page
  document.querySelectorAll('[data-entry-point]').forEach(el=>{

    const reader=new FileReader();
    reader.onload=async(ev)=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1});
        // Parse bank Excel file
        // Find header row automatically
        let headerRowIdx = -1;
        for(let i=0;i<Math.min(rows.length,10);i++){
          const row = rows[i]||[];
          const rowStr = row.map(c=>String(c||'').toLowerCase()).join('|');
          if(rowStr.includes('дебет')||rowStr.includes('кредит')||rowStr.includes('дата опер')){
            headerRowIdx = i;
            break;
          }
        }
        if(headerRowIdx<0) headerRowIdx=1; // fallback to row 2

        const header = (rows[headerRowIdx]||[]).map(h=>String(h||'').toLowerCase().trim());

        const col = (keywords) => {
          for(const kw of keywords){
            const i = header.findIndex(h=>h.includes(kw));
            if(i>=0) return i;
          }
          return -1;
        };

        const iFirma  = col(['фирма','firma','компания']);
        const iDate   = col(['дата опера','дата опер','дата','date']);
        const iDebit  = col(['дебет','debit']);
        const iCredit = col(['кредит','credit']);
        const iName   = col(['наименование','отправител','бенефициар']);
        const iPurp   = col(['назначение','платеж','purpose']);
        const iCat    = col(['категория','category']);

        const dataRows = rows.slice(headerRowIdx+1);

        const newTx = dataRows.filter(r=>Array.isArray(r)&&r.some(c=>c!=null&&c!=='')).map(r=>{
          const getVal = (idx, fallback) => {
            if(idx>=0 && idx<r.length) return r[idx];
            if(fallback>=0 && fallback<r.length) return r[fallback];
            return '';
          };
          const debitRaw  = String(getVal(iDebit,  3)||'').replace(/\s/g,'').replace(',','.').replace(/[^0-9.]/g,'');
          const creditRaw = String(getVal(iCredit, 4)||'').replace(/\s/g,'').replace(',','.').replace(/[^0-9.]/g,'');
          const debit  = parseFloat(debitRaw)||0;
          const credit = parseFloat(creditRaw)||0;
          if(!debit && !credit) return null;
          return {
            doc_no:      String(getVal(iFirma, 0)||''),
            date:        String(getVal(iDate,  2)||''),
            debit,
            credit,
            counterpart: String(getVal(iName,  5)||''),
            purpose:     String(getVal(iPurp, 10)||''),
            category:    String(getVal(iCat,  12)||''),
            description: String(getVal(iName,  5)||''),
            source_file: file.name,
            approved:    false,
          };
        }).filter(r=>r!==null);
        if(!newTx.length){showAlert('error','Нет данных в файле');return;}
        const {error}=await sb.from('bank_transactions').insert(newTx);
        if(error){showAlert('error',error.message);}else{showAlert('success',`Загружено ${newTx.length} операций`);await loadAll();}
      }catch(err){showAlert('error','Ошибка файла: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
    e.target.value='';

let targetsState = { saving: {} };
const TARGET_METRICS = [
  { key:'sales_target',   label:'Цель продаж',    icon:'🎯', color:'var(--accent)'  },
  { key:'expense_limit',  label:'Лимит расходов', icon:'💸', color:'var(--accent2)' },
  { key:'profit_target',  label:'Цель прибыли',   icon:'💰', color:'var(--accent3)' },
];

function renderTargets(){
  const last30 = getLast(30);
  const pts = POINTS.filter(p=>p.id!=='ofis');

  const rows = pts.map(p=>{
    const tgt = STATE.targets?.[p.id] || {};
    const pEntries = STATE.entries.filter(e=>e.point_id===p.id&&last30.includes(e.date));
    const pExp     = STATE.expenses.filter(e=>e.point_id===p.id&&last30.includes(e.date));
    const actualSales  = pEntries.reduce((s,e)=>s+Number(e.sold||0),0);
    const actualExp    = pExp.reduce((s,e)=>s+Number(e.amount||0),0);
    const actualBought = pEntries.reduce((s,e)=>s+Number(e.received||0),0);
    const allCatsPt = CATS[p.id]||[];
    const lastRem = allCatsPt.reduce((tot,cat)=>{
      const last = pEntries.filter(e=>e.category===cat).sort((a,b)=>b.date.localeCompare(a.date))[0];
      return tot+(last?Number(last.remaining||0):0);
    },0);
    const actualProfit = actualSales - actualBought - actualExp + lastRem;

    const actuals = { sales_target: actualSales, expense_limit: actualExp, profit_target: actualProfit };

    return `
      <div class="table-card" style="margin-bottom:14px;">
        <div class="table-head"><h3>📍 ${p.name}</h3></div>
        <div style="padding:16px;display:flex;flex-direction:column;gap:16px;">
          ${TARGET_METRICS.map(m=>{
            const val    = tgt[m.key] ? Number(tgt[m.key]) : 0;
            const actual = actuals[m.key] || 0;
            const pct    = val>0 ? Math.min((actual/val)*100,100).toFixed(0) : 0;
            const over   = m.key==='expense_limit' ? actual>val&&val>0 : false;
            const barColor = over ? 'var(--accent2)' : m.color;
            return `
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px;">
                <span style="font-size:13px;font-weight:600;">${m.icon} ${m.label}</span>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:11px;color:var(--text2);">Факт: <b style="color:${m.color};">${fmt(actual)}</b></span>
                  <input type="number" 
                    value="${val||''}" 
                    placeholder="Введите цель..."
                    style="width:140px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;outline:none;"
                    onfocus="this.style.borderColor='var(--accent)'"
                    onblur="this.style.borderColor='var(--border)';saveTarget('${p.id}','${m.key}',this.value)"
                  />
                </div>
              </div>
              ${val>0?`
              <div style="height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;">
                <div style="height:100%;width:${pct}%;background:${barColor};border-radius:4px;transition:width .6s;"></div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:4px;">
                <span style="font-size:10px;color:var(--text3);">${pct}% выполнено</span>
                <span style="font-size:10px;color:var(--text3);">Цель: ${fmt(val)}</span>
              </div>`:'<div style="height:8px;background:var(--bg3);border-radius:4px;"></div>'}
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');

  // Overall summary
  const totSales30  = STATE.entries.filter(e=>last30.includes(e.date)).reduce((s,e)=>s+Number(e.sold||0),0);
  const totExp30    = STATE.expenses.filter(e=>last30.includes(e.date)).reduce((s,e)=>s+Number(e.amount||0),0);
  const totBought30 = STATE.entries.filter(e=>last30.includes(e.date)).reduce((s,e)=>s+Number(e.received||0),0);

  return `
    <div class="alert alert-warn" style="margin-bottom:16px;">
      📅 Показатели за последние 30 дней. Введите цели — прогресс обновится автоматически.
    </div>
    <div class="stats-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="stat-label">Продажи (30 дн)</div><div class="stat-value y">${fmt(totSales30)}</div></div>
      <div class="stat-card"><div class="stat-label">Расходы (30 дн)</div><div class="stat-value r">${fmt(totExp30)}</div></div>
      <div class="stat-card"><div class="stat-label">Закуп (30 дн)</div><div class="stat-value b">${fmt(totBought30)}</div></div>
    </div>
    <div class="section-title">Цели по точкам</div>
    ${rows}
  `;
}

async function saveTarget(pointId, metric, value){
  const val = parseFloat(value)||0;
  if(!STATE.targets) STATE.targets={};
  if(!STATE.targets[pointId]) STATE.targets[pointId]={};
  STATE.targets[pointId][metric] = val;
  // Upsert into targets table
  const {error} = await sb.from('targets')
    .upsert({point_id:pointId, metric, value:val}, {onConflict:'point_id,metric'});
  if(error) showAlert('error','Ошибка сохранения: '+error.message);
  else showAlert('success','Цель сохранена');
}

  const advs = staffData.advances.filter(a=>a.employee_id===empId);
  const pays = staffData.payments.filter(p=>p.employee_id===empId);
  const all = [
    ...advs.map(a=>({...a,_type:'Аванс'})),
    ...pays.map(p=>({...p,_type:'Зарплата'})),
  ].sort((a,b)=>b.date?.localeCompare(a.date));
  return `
    <div class="table-card" style="margin-top:14px;border-color:var(--accent);">
      <div class="table-head">

async function handleStaffImport(input){

      let hi=-1;
      for(let i=0;i<Math.min(rows.length,5);i++){
        const s=(rows[i]||[]).join('|').toLowerCase();
        if(s.includes('имя')||s.includes('фио')||s.includes('name')){hi=i;break;}
      }
      if(hi<0) hi=0;
      const hdr=(rows[hi]||[]).map(h=>String(h||'').toLowerCase().trim());
      const iName=hdr.findIndex(h=>h.includes('имя')||h.includes('фио')||h.includes('name'));
      const iPos=hdr.findIndex(h=>h.includes('должн')||h.includes('позиц')||h.includes('position'));
      const iPt=hdr.findIndex(h=>h.includes('точк')||h.includes('point')||h.includes('объект'));
      const iSal=hdr.findIndex(h=>h.includes('оклад')||h.includes('зарпл')||h.includes('salary'));
      const iPhone=hdr.findIndex(h=>h.includes('телеф')||h.includes('phone'));
      const ptMap={'17мкр':'mkr17','17-й':'mkr17','mkr17':'mkr17','5мкр':'mkr5','5-й':'mkr5','mkr5':'mkr5','база':'baza','baza':'baza','полфабрикат':'polf','polf':'polf','офис':'ofis','ofis':'ofis'};
      const parsed=rows.slice(hi+1).filter(r=>r[iName>=0?iName:0]).map(r=>{
        const ptRaw=String(r[iPt>=0?iPt:2]||'').toLowerCase().trim();
        const ptId=Object.entries(ptMap).find(([k])=>ptRaw.includes(k))?.[1]||'';
        return {
          name:String(r[iName>=0?iName:0]||'').trim(),
          position:String(r[iPos>=0?iPos:1]||'').trim(),

async function downloadBackup(){
  try{
    const [e,ex,sal,bk,us] = await Promise.all([
      sb.from('daily_entries').select('*'),
      sb.from('expenses').select('*'),
      sb.from('salaries').select('*'),
      sb.from('bank_transactions').select('*'),
      sb.from('users').select('*'),
    ]);
    const backup = {
      version: '1.0',
      date: new Date().toISOString(),
      project: 'Istanbul Et Market',
      daily_entries: e.data||[],
      expenses: ex.data||[],
      salaries: sal.data||[],
      bank_transactions: bk.data||[],
      users: us.data||[],
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup_istanbul_et_market_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showAlert('success', 'Резервная копия скачана!');
  }catch(err){
    showAlert('error', 'Ошибка резервной копии: ' + err.message);
  }
}

async function restoreBackup(file){
  if(!file) return;
  if(!confirm('ВНИМАНИЕ! Восстановление перезапишет данные. Продолжить?')) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.version || !data.daily_entries) throw new Error('Неверный формат файла резервной копии');
    showAlert('warn', 'Восстановление... Не закрывайте страницу.');

    // Clear and restore each table
    if(data.daily_entries?.length){
      await sb.from('daily_entries').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('daily_entries').insert(data.daily_entries);
    }
    if(data.expenses?.length){
      await sb.from('expenses').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('expenses').insert(data.expenses);
    }
    if(data.salaries?.length){
      await sb.from('salaries').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('salaries').insert(data.salaries);
    }
    if(data.bank_transactions?.length){
      await sb.from('bank_transactions').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('bank_transactions').insert(data.bank_transactions);
    }
    await loadAll();
    showAlert('success', 'Данные успешно восстановлены из резервной копии!');
  }catch(err){
    showAlert('error', 'Ошибка восстановления: ' + err.message);
  }
}

async function updateBankTx(id, field, value){
  const update = {};
  update[field] = value;
  await sb.from('bank_transactions').update(update).eq('id', id);
  // Update local state without full reload for speed
  STATE.bankTx = STATE.bankTx.map(t=>t.id===id?{...t,...update}:t);

async function transferExpensesFromBank(){
  const toTransfer = STATE.bankTx.filter(t=>
    t.is_expense && t.point_id && t.expense_type && Number(t.debit)>0 && !t.approved
  );
  
  if(toTransfer.length===0){
    showAlert('error','Нет записей для переноса. Отметьте галочку "Расход?" и выберите Точку и Тип расхода.');
    return;
  }
  
  if(!confirm(`Перенести ${toTransfer.length} записей в Расходы?`)) return;
  
  let saved=0, errors=0;
  for(const t of toTransfer){
    // Add to expenses
    const {error} = await sb.from('expenses').insert({
      date: t.date?.slice(0,10)||today(),
      point_id: t.point_id,
      type: t.expense_type,
      amount: Number(t.debit),
      description: t.purpose||t.counterpart||'Из банка',
      user_id: STATE.user.id,
    });
    if(error){ errors++; continue; }
    
    // Mark as approved in bank
    await sb.from('bank_transactions').update({approved:true}).eq('id',t.id);
    saved++;
  }
  
  await loadAll();
  showAlert(errors>0?'error':'success',
    `✓ Перенесено ${saved} расходов${errors>0?', ошибок: '+errors:''}`);
}

// ─── EXCEL IMPORT ─────────────────────────────────────────────────────────────
async function handleEntryImport(input, pointId){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async(ev)=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      // Find ДАННЫЕ sheet
      const sheetName = wb.SheetNames.find(n=>n.includes('ДАНН')||n.includes('DATA')||n.includes('данн')) || wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false});
      
      // Find header row
      let headerIdx = -1;
      for(let i=0;i<Math.min(rows.length,5);i++){
        const row = rows[i]||[];
        const str = row.join('|').toLowerCase();
        if(str.includes('дата')&&(str.includes('закуп')||str.includes('категор'))){
          headerIdx = i; break;
        }
      }
      if(headerIdx<0){ showAlert('error','Не найден заголовок (Дата, Категория, Закуп...)'); return; }
      
      const header = rows[headerIdx].map(h=>String(h||'').toLowerCase().trim());
      const iDate = header.findIndex(h=>h.includes('дат'));
      const iCat  = header.findIndex(h=>h.includes('катег'));
      const iRecv = header.findIndex(h=>h.includes('закуп'));
      const iSold = header.findIndex(h=>h.includes('продаж'));
      const iRem  = header.findIndex(h=>h.includes('остат'));
      const iNote = header.findIndex(h=>h.includes('примеч'));
      
      const validCats = CATS[pointId]||[];
      const parsed = [];
      const errors = [];
      
      rows.slice(headerIdx+1).forEach((row,i)=>{
        if(!row||!row.some(c=>c)) return;
        const dateRaw = String(row[iDate]||'').trim();
        const cat     = String(row[iCat]||'').trim();
        const recv    = parseFloat(String(row[iRecv]||'').replace(/[^0-9.,]/g,'').replace(',','.'))||0;
        const sold    = parseFloat(String(row[iSold]||'').replace(/[^0-9.,]/g,'').replace(',','.'))||0;
        const rem     = parseFloat(String(row[iRem] ||'').replace(/[^0-9.,]/g,'').replace(',','.'))||0;
        const note    = iNote>=0?String(row[iNote]||''):'';
        
        if(!dateRaw||!cat) return;
        if(!validCats.includes(cat)){ errors.push(`Строка ${headerIdx+i+2}: неизвестная категория "${cat}"`); return; }
        if(!recv&&!sold&&!rem) return; // skip empty rows
        
        // Parse date DD.MM.YYYY → YYYY-MM-DD
        let dateISO = '';
        const dMatch = dateRaw.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/);
        if(dMatch){
          const [,d,m,y] = dMatch;
          const year = y.length===2?'20'+y:y;
          dateISO = `${year}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
        } else { errors.push(`Строка ${headerIdx+i+2}: неверный формат даты "${dateRaw}"`); return; }
        
        parsed.push({date:dateISO, point_id:pointId, category:cat, received:recv, sold, remaining:rem, note});
      });
      
      entryState.importData = parsed;
      entryState.importErrors = errors;
      entryState.importMode = true;
      render();
      showAlert('success', `Прочитано ${parsed.length} строк${errors.length>0?' ('+errors.length+' ошибок)':''}`);
    }catch(err){
      showAlert('error','Ошибка чтения файла: '+err.message);
    }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}

        const ptRaw   = String(row[iPt]||'').trim().toLowerCase();
        const type    = String(row[iType]||'').trim();
        const amt     = parseFloat(String(row[iAmt]||'').replace(/[^0-9.,]/g,'').replace(',','.'))||0;
        const desc    = iDesc>=0?String(row[iDesc]||''):'';
        
        if(!dateRaw||!type||!amt) return;
        const ptId = ptMap[ptRaw];
        if(!ptId){ errors.push(`Строка ${headerIdx+i+2}: неизвестная точка "${ptRaw}"`); return; }
        
        let dateISO = '';
        const dMatch = dateRaw.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/);
        if(dMatch){
          const [,d,m,y] = dMatch;
          dateISO = `${y.length===2?'20'+y:y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
        } else { errors.push(`Строка ${headerIdx+i+2}: неверный формат даты`); return; }
        
        parsed.push({date:dateISO, point_id:ptId, type, amount:amt, description:desc, user_id:STATE.user.id});
      });
      
      expImportData = parsed;
      expImportErrors = errors;
      expImportMode = true;
      render();
      showAlert('success', `Прочитано ${parsed.length} расходов${errors.length>0?' ('+errors.length+' ошибок)':''}`);
    }catch(err){ showAlert('error','Ошибка: '+err.message); }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}

async function saveEntryImport(){
  if(!entryState.importData.length) return;
  const btn = document.getElementById('import-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Сохранение...'; }
  
  let saved=0, updated=0, errors=0;
  for(const row of entryState.importData){
    const existing = STATE.entries.find(e=>e.point_id===row.point_id&&e.date===row.date&&e.category===row.category);
    let err;
    if(existing){
      const r = await sb.from('daily_entries').update({
        received:row.received, sold:row.sold, remaining:row.remaining,
        note:row.note, updated_at:new Date().toISOString()
      }).eq('id',existing.id);
      err=r.error; if(!err) updated++;
    } else {
      const r = await sb.from('daily_entries').insert({...row, user_id:STATE.user.id});
      err=r.error; if(!err) saved++;
    }
    if(err) errors++;
  }
  
  entryState.importMode = false;
  entryState.importData = [];
  entryState.importErrors = [];
  await loadAll();
  showAlert(errors>0?'error':'success',
    `✓ Новых: ${saved}, обновлено: ${updated}${errors>0?', ошибок: '+errors:''}`);
}

async function saveExpenseImport(){
  if(!expImportData.length) return;
  const btn = document.getElementById('exp-import-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Сохранение...'; }
  
  let saved=0, errors=0;
  // Insert in batches of 50
  for(let i=0;i<expImportData.length;i+=50){
    const batch = expImportData.slice(i,i+50);
    const {error} = await sb.from('expenses').insert(batch);
    if(error) errors+=batch.length;
    else saved+=batch.length;
  }
  
  expImportMode = false;
  expImportData = [];
  expImportErrors = [];
  await loadAll();
  showAlert(errors>0?'error':'success', `✓ Сохранено ${saved} расходов${errors>0?', ошибок: '+errors:''}`);
}

// Expense import state (global)
let expImportData = [];
let expImportErrors = [];
let expImportMode = false;

// ─── INIT ────────────────────────────────────────────────────────────────────
const saved = sessionStorage.getItem('uchet_user');
if(saved){try{STATE.user=JSON.parse(saved);}catch{}}
STATE.loading=false;
render();
if(STATE.user) loadAll();
</script>
