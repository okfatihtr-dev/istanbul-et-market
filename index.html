    const {error}=await sb.from('users').insert(d);
    if(error){showAlert('error',error.message);}
    else{showAlert('success','Пользователь создан');userModal=false;usersLoaded=false;render();}
  });
  document.querySelectorAll('[data-del-user]').forEach(el=>{
    el.addEventListener('click',async()=>{
      if(!confirm('Удалить пользователя?')) return;
      await sb.from('users').delete().eq('id',el.dataset.delUser);
      usersLoaded=false;render();
    });
  });

  // Admin — change other user's password
  document.querySelectorAll('[data-pass-user]').forEach(el=>{
    el.addEventListener('click',()=>{
      passModal={userId:el.dataset.passUser, name:el.dataset.passName};
      render();
    });
  });
  document.getElementById('pass-modal-close')?.addEventListener('click',()=>{passModal=null;render();});
  document.getElementById('pass-modal-close2')?.addEventListener('click',()=>{passModal=null;render();});
  document.getElementById('pass-modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='pass-modal-overlay'){passModal=null;render();}});
  document.getElementById('pass-save-btn')?.addEventListener('click',async()=>{
    const np=document.getElementById('new-pass').value;
    const np2=document.getElementById('new-pass2').value;
    const errDiv=document.getElementById('pass-err');
    if(!np||!np2){errDiv.innerHTML='<div class="alert alert-error">Заполните оба поля</div>';return;}
    if(np!==np2){errDiv.innerHTML='<div class="alert alert-error">Пароли не совпадают</div>';return;}
    if(np.length<4){errDiv.innerHTML='<div class="alert alert-error">Минимум 4 символа</div>';return;}
    const btn=document.getElementById('pass-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    const {error}=await sb.from('users').update({password:np}).eq('id',passModal.userId);
    if(error){errDiv.innerHTML=`<div class="alert alert-error">${error.message}</div>`;btn.disabled=false;btn.textContent='Сохранить';}
    else{showAlert('success','Пароль изменён для: '+passModal.name);passModal=null;usersLoaded=false;render();}
  });
}

// ─── STAFF / SALARY TRACKING ─────────────────────────────────────────────────
function renderStaff(){
  if(!staffLoaded){
    Promise.all([
      sb.from('staff').select('*').order('name'),
      sb.from('staff_advances').select('*').order('date',{ascending:false}),
      sb.from('staff_salary_payments').select('*').order('date',{ascending:false}),
    ]).then(([s,a,p])=>{
      staffData = {
        employees: s.data||[],
        advances: a.data||[],
        payments: p.data||[],
      };
      staffLoaded=true;
      render();
    });
    return '<div class="loading-screen" style="min-height:200px;"><div class="spinner"></div></div>';
  }

  const {employees, advances, payments} = staffData;

  // Summary per employee
  const empSummary = employees.map(emp=>{
    const empAdv = advances.filter(a=>a.employee_id===emp.id);
    const empPay = payments.filter(p=>p.employee_id===emp.id);
    const totalAdvances = empAdv.reduce((s,a)=>s+Number(a.amount||0),0);
    const totalPaid = empPay.reduce((s,p)=>s+Number(p.amount||0),0);
    const totalOwed = totalAdvances + totalPaid; // what's been given
    const remaining = Number(emp.monthly_salary||0) - totalOwed % Number(emp.monthly_salary||1);
    const netRemaining = Number(emp.monthly_salary||0) - (totalAdvances + totalPaid) % (Number(emp.monthly_salary||1)||1);
    // simpler: this month
    const thisMonth = new Date().toISOString().slice(0,7);
    const monthAdv = empAdv.filter(a=>a.date?.startsWith(thisMonth)).reduce((s,a)=>s+Number(a.amount||0),0);
    const monthPay = empPay.filter(p=>p.date?.startsWith(thisMonth)).reduce((s,p)=>s+Number(p.amount||0),0);
    const monthRemaining = Number(emp.monthly_salary||0) - monthAdv - monthPay;
    return {...emp, totalAdvances, totalPaid, monthAdv, monthPay, monthRemaining};
  });

  const totalSalaryBudget = employees.reduce((s,e)=>s+Number(e.monthly_salary||0),0);
  const totalAdvancesGiven = advances.reduce((s,a)=>s+Number(a.amount||0),0);
  const totalPaidOut = payments.reduce((s,p)=>s+Number(p.amount||0),0);

  const empCards = empSummary.map(emp=>`
    <div class="table-card" style="margin-bottom:14px;">
      <div class="table-head">
        <div>
          <h3 style="font-size:14px;">👤 ${emp.name}</h3>
          <span style="font-size:11px;color:var(--text3);">${POINTS.find(p=>p.id===emp.point_id)?.name||'—'} · ${emp.position||'—'}</span>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" style="font-size:11px;" data-advance-emp="${emp.id}" data-advance-name="${emp.name}">💰 Авансировать</button>
          <button class="btn btn-success" style="font-size:11px;" data-salpay-emp="${emp.id}" data-salpay-name="${emp.name}">✅ Выдать зарплату</button>
          <button class="btn btn-danger" style="font-size:11px;" data-del-emp="${emp.id}">✕</button>
        </div>
      </div>
      <div style="padding:16px;">
        <div class="stats-grid" style="margin-bottom:14px;">
          <div class="stat-card"><div class="stat-label">Оклад (месяц)</div><div class="stat-value y" style="font-size:16px;">${fmt(emp.monthly_salary)}</div></div>
          <div class="stat-card"><div class="stat-label">Авансы (этот месяц)</div><div class="stat-value r" style="font-size:16px;">${fmt(emp.monthAdv)}</div></div>
          <div class="stat-card"><div class="stat-label">Выдано зарплаты</div><div class="stat-value b" style="font-size:16px;">${fmt(emp.monthPay)}</div></div>
          <div class="stat-card" style="border-color:${emp.monthRemaining>=0?'rgba(16,185,129,.3)':'rgba(239,68,68,.3)'};">
            <div class="stat-label">Остаток к выдаче</div>
            <div class="stat-value" style="font-size:16px;color:${emp.monthRemaining>=0?'var(--accent3)':'var(--accent2)'};">${fmt(emp.monthRemaining)}</div>
          </div>
        </div>

        ${advances.filter(a=>a.employee_id===emp.id).length>0||payments.filter(p=>p.employee_id===emp.id).length>0?`
        <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;">История</div>
        <div style="max-height:180px;overflow-y:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;">
            <colgroup><col style="width:20%"><col style="width:20%"><col style="width:20%"><col style="width:40%"></colgroup>
            <thead><tr style="background:var(--bg3);">
              <th style="padding:6px 10px;text-align:left;">Дата</th>
              <th style="padding:6px 10px;text-align:left;">Тип</th>
              <th style="padding:6px 10px;text-align:right;">Сумма</th>
              <th style="padding:6px 10px;">Описание</th>
            </tr></thead>
            <tbody>
              ${[
                ...advances.filter(a=>a.employee_id===emp.id).map(a=>`<tr style="border-top:1px solid var(--border);">
                  <td style="padding:6px 10px;">${fmtDate(a.date)}</td>
                  <td style="padding:6px 10px;"><span class="badge badge-r">Аванс</span></td>
                  <td style="padding:6px 10px;text-align:right;color:var(--accent2);">${fmt(a.amount)}</td>
                  <td style="padding:6px 10px;color:var(--text3);">${a.note||'—'}</td>
                </tr>`),
                ...payments.filter(p=>p.employee_id===emp.id).map(p=>`<tr style="border-top:1px solid var(--border);">
                  <td style="padding:6px 10px;">${fmtDate(p.date)}</td>
                  <td style="padding:6px 10px;"><span class="badge badge-g">Зарплата</span></td>
                  <td style="padding:6px 10px;text-align:right;color:var(--accent3);">${fmt(p.amount)}</td>
                  <td style="padding:6px 10px;color:var(--text3);">${p.note||'—'}</td>
                </tr>`)
              ].join('')}
            </tbody>
          </table>
        </div>`:
        '<div style="color:var(--text3);font-size:12px;padding:8px 0;">Нет истории операций</div>'}
      </div>
    </div>
  `).join('');

  // Add employee modal
  const newEmpModal = staffModal ? `
    <div class="modal-overlay" id="staff-modal-overlay">
      <div class="modal">
        <div class="modal-head"><h3>➕ Новый сотрудник</h3><button class="close-btn" id="staff-modal-close">✕</button></div>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group"><label>ФИО</label><input class="form-control" id="emp-name" placeholder="Имя Фамилия"/></div>
            <div class="form-group"><label>Должность</label><input class="form-control" id="emp-position" placeholder="Продавец, Кассир..."/></div>
            <div class="form-group"><label>Точка</label>
              <select class="form-control" id="emp-point">
                <option value="">— выберите —</option>
                ${POINTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
              </select>
            </div>
            <div class="form-group"><label>Оклад (месяц) ₸</label><input type="number" class="form-control" id="emp-salary" placeholder="0"/></div>
            <div class="form-group"><label>Телефон</label><input class="form-control" id="emp-phone" placeholder="+7..."/></div>
            <div class="form-group"><label>Дата найма</label><input type="date" class="form-control" id="emp-hire" value="${today()}"/></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="staff-modal-close2">Отмена</button>
          <button class="btn btn-primary" id="emp-save-btn">Добавить</button>
        </div>
      </div>
    </div>` : '';

  // Advance modal
  const advModal = advanceModal ? `
    <div class="modal-overlay" id="advance-modal-overlay">
      <div class="modal">
        <div class="modal-head"><h3>💰 Аванс — ${advanceModal.name}</h3><button class="close-btn" id="advance-close">✕</button></div>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group"><label>Дата</label><input type="date" class="form-control" id="adv-date" value="${today()}"/></div>
            <div class="form-group"><label>Сумма ₸</label><input type="number" class="form-control" id="adv-amount" placeholder="0"/></div>
            <div class="form-group" style="grid-column:1/-1;"><label>Примечание</label><input class="form-control" id="adv-note" placeholder="Необязательно"/></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="advance-close2">Отмена</button>
          <button class="btn btn-primary" id="adv-save-btn">Сохранить</button>
        </div>
      </div>
    </div>` : '';

  // Salary payment modal
  const salPayModalHtml = salPayModal ? `
    <div class="modal-overlay" id="salpay-modal-overlay">
      <div class="modal">
        <div class="modal-head"><h3>✅ Выдача зарплаты — ${salPayModal.name}</h3><button class="close-btn" id="salpay-close">✕</button></div>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group"><label>Дата</label><input type="date" class="form-control" id="salpay-date" value="${today()}"/></div>
            <div class="form-group"><label>Сумма ₸</label><input type="number" class="form-control" id="salpay-amount" placeholder="0"/></div>
            <div class="form-group" style="grid-column:1/-1;"><label>Примечание</label><input class="form-control" id="salpay-note" placeholder="Необязательно"/></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="salpay-close2">Отмена</button>
          <button class="btn btn-primary" id="salpay-save-btn">Сохранить</button>
        </div>
      </div>
    </div>` : '';

  return `
    <div class="stats-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="stat-label">Сотрудников</div><div class="stat-value y">${employees.length}</div></div>
      <div class="stat-card"><div class="stat-label">Фонд зарплат</div><div class="stat-value b">${fmt(totalSalaryBudget)}</div><div class="stat-sub">в месяц</div></div>
      <div class="stat-card"><div class="stat-label">Выдано авансов</div><div class="stat-value r">${fmt(totalAdvancesGiven)}</div></div>

    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
      <button class="btn btn-primary" id="add-emp-btn">➕ Добавить сотрудника</button>
    </div>
    ${employees.length===0?'<div class="empty">Нет сотрудников. Добавьте первого.</div>':empCards}
    ${newEmpModal}${advModal}${salPayModalHtml}
  `;
}

let carilerModal = null;   // new debtor
let paymentModal = null;   // record payment
let carilerPoint = '';     // selected point

function renderCariler(){
  const accessPoints = STATE.user.role==='admin'
    ? POINTS.filter(p=>['mkr17','mkr5','baza'].includes(p.id))
    : POINTS.filter(p=>p.id===STATE.user.point_id&&['mkr17','mkr5','baza'].includes(p.id));

  if(!carilerPoint && accessPoints[0]) carilerPoint = accessPoints[0].id;

  if(!carilerLoaded){
    Promise.all([
      sb.from('debtors').select('*').order('name'),
      sb.from('debtor_payments').select('*').order('date',{ascending:false}),
    ]).then(([d,p])=>{
      carilerData = {debtors: d.data||[], payments: p.data||[]};
      carilerLoaded = true;
      render();
    });
    return '<div class="loading-screen" style="min-height:200px;"><div class="spinner"></div></div>';
  }

  const {debtors, payments} = carilerData;

  // Filter by selected point
  const ptDebtors = debtors.filter(d=>d.point_id===carilerPoint);

  // Enrich with payment history
  const enriched = ptDebtors.map(d=>{
    const dPay = payments.filter(p=>p.debtor_id===d.id);
    const totalPaid = dPay.reduce((s,p)=>s+Number(p.amount||0),0);
    const remaining = Number(d.total_debt||0) - totalPaid;
    return {...d, totalPaid, remaining, payments: dPay};
  });

  const totalDebt = enriched.reduce((s,d)=>s+Number(d.total_debt||0),0);
  const totalPaid = enriched.reduce((s,d)=>s+d.totalPaid,0);
  const totalRemaining = enriched.reduce((s,d)=>s+d.remaining,0);

  // Point tabs
  const tabs = accessPoints.map(p=>`
    <div class="tab ${carilerPoint===p.id?'active':''}" onclick="carilerPoint='${p.id}';carilerLoaded=false;render();">
      ${p.name}
    </div>`).join('');

  // Debtor cards
  const debtorCards = enriched.length===0
    ? '<div class="empty">Нет должников для этой точки</div>'
    : enriched.sort((a,b)=>b.remaining-a.remaining).map(d=>`
    <div class="table-card" style="margin-bottom:12px;">
      <div class="table-head">
        <div>
          <h3 style="font-size:14px;">👤 ${d.name}</h3>
          <span style="font-size:11px;color:var(--text3);">${d.phone||'—'} · ${fmtDate(d.date)}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div style="text-align:right;margin-right:8px;">
            <div style="font-size:10px;color:var(--text3);">Остаток долга</div>
            <div style="font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;color:${d.remaining>0?'var(--accent2)':d.remaining<0?'var(--accent3)':'var(--text3)'};">${fmt(d.remaining)}</div>
          </div>
          ${d.remaining>0?`<button class="btn btn-success" style="font-size:11px;" onclick="paymentModal={id:'${d.id}',name:'${d.name}',remaining:${d.remaining}};render();">💵 Оплата</button>`:'<span class="badge badge-g">✅ Погашен</span>'}
          <button class="btn btn-danger" style="font-size:11px;" onclick="if(confirm('Удалить?')){sb.from('debtor_payments').delete().eq('debtor_id','${d.id}').then(()=>sb.from('debtors').delete().eq('id','${d.id}').then(()=>{carilerLoaded=false;render();}));}">✕</button>
        </div>
      </div>
      <div style="padding:12px 16px;">
        <div style="display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;">
          <div><span style="font-size:10px;color:var(--text3);">Общий долг:</span> <b style="color:var(--accent2);">${fmt(d.total_debt)}</b></div>
          <div><span style="font-size:10px;color:var(--text3);">Оплачено:</span> <b style="color:var(--accent3);">${fmt(d.totalPaid)}</b></div>
          ${d.description?`<div><span style="font-size:10px;color:var(--text3);">Описание:</span> <span style="font-size:12px;">${d.description}</span></div>`:''}
        </div>
        ${d.payments.length>0?`
        <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;">История оплат</div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          ${d.payments.map(p=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg3);border-radius:6px;font-size:12px;">
              <span style="color:var(--text2);">${fmtDate(p.date)}</span>
              <span style="color:var(--accent3);font-weight:600;">+${fmt(p.amount)}</span>
              <span style="color:var(--text3);">${p.note||''}</span>
            </div>`).join('')}
        </div>`:''}
      </div>
    </div>`).join('');

  // New debtor modal
  const newModal = carilerModal ? `
    <div class="modal-overlay" id="caril-modal-overlay">
      <div class="modal">
        <div class="modal-head"><h3>➕ Новый должник</h3><button class="close-btn" onclick="carilerModal=null;render();">✕</button></div>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group"><label>ФИО / Название</label><input class="form-control" id="c-name" placeholder="Имя должника"/></div>
            <div class="form-group"><label>Телефон</label><input class="form-control" id="c-phone" placeholder="+7..."/></div>
            <div class="form-group"><label>Сумма долга ₸</label><input type="number" class="form-control" id="c-debt" placeholder="0"/></div>
            <div class="form-group"><label>Дата</label><input type="date" class="form-control" id="c-date" value="${today()}"/></div>
            <div class="form-group" style="grid-column:1/-1;"><label>Описание</label><input class="form-control" id="c-desc" placeholder="Товар, причина долга..."/></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="carilerModal=null;render();">Отмена</button>
          <button class="btn btn-primary" id="caril-save-btn">Добавить</button>
        </div>
      </div>
    </div>` : '';

  // Payment modal
  const payModal = paymentModal ? `
    <div class="modal-overlay" id="pay-modal-overlay">
      <div class="modal">
        <div class="modal-head"><h3>💵 Оплата долга — ${paymentModal.name}</h3><button class="close-btn" onclick="paymentModal=null;render();">✕</button></div>
        <div class="modal-body">
          <div class="alert alert-warn">Остаток долга: <b>${fmt(paymentModal.remaining)}</b></div>
          <div class="form-grid">
            <div class="form-group"><label>Дата</label><input type="date" class="form-control" id="pay-date" value="${today()}"/></div>
            <div class="form-group"><label>Сумма ₸</label><input type="number" class="form-control" id="pay-amount" placeholder="0" value="${paymentModal.remaining}"/></div>
            <div class="form-group" style="grid-column:1/-1;"><label>Примечание</label><input class="form-control" id="pay-note" placeholder="Необязательно"/></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="paymentModal=null;render();">Отмена</button>
          <button class="btn btn-primary" id="pay-save-btn">Сохранить</button>
        </div>
      </div>
    </div>` : '';

  return `
    <div class="alert alert-warn" style="margin-bottom:16px;">
      ℹ️ Карточки должников не влияют на расчёт прибыли — только для учёта.
    </div>
    <div class="stats-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="stat-label">Должников</div><div class="stat-value y">${enriched.length}</div></div>
      <div class="stat-card"><div class="stat-label">Общий долг</div><div class="stat-value r">${fmt(totalDebt)}</div></div>
      <div class="stat-card"><div class="stat-label">Оплачено</div><div class="stat-value g">${fmt(totalPaid)}</div></div>
      <div class="stat-card" style="border-color:${totalRemaining>0?'rgba(239,68,68,.3)':'rgba(16,185,129,.3)'};">
        <div class="stat-label">Остаток долга</div>
        <div class="stat-value" style="color:${totalRemaining>0?'var(--accent2)':'var(--accent3)'};">${fmt(totalRemaining)}</div>
      </div>
    </div>
    <div class="tabs" style="margin-bottom:16px;">${tabs}</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
      <button class="btn btn-primary" onclick="carilerModal={};render();">➕ Добавить должника</button>
    </div>
    ${debtorCards}
    ${newModal}${payModal}
  `;
}

// ─── BACKUP / RESTORE ────────────────────────────────────────────────────────
async function downloadBackup(){
  try{
    const [e,ex,sal,bk,us] = await Promise.all([
      sb.from('daily_entries').select('*'),
      sb.from('expenses').select('*'),
      sb.from('salaries').select('*'),
      sb.from('bank_transactions').select('*'),
      sb.from('users').select('*'),
    ]);
    const backup = {
      version: '1.0',
      date: new Date().toISOString(),
      project: 'Istanbul Et Market',
      daily_entries: e.data||[],
      expenses: ex.data||[],
      salaries: sal.data||[],
      bank_transactions: bk.data||[],
      users: us.data||[],
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup_istanbul_et_market_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showAlert('success', 'Резервная копия скачана!');
  }catch(err){
    showAlert('error', 'Ошибка резервной копии: ' + err.message);
  }
}

async function restoreBackup(file){
  if(!file) return;
  if(!confirm('ВНИМАНИЕ! Восстановление перезапишет данные. Продолжить?')) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.version || !data.daily_entries) throw new Error('Неверный формат файла резервной копии');
    showAlert('warn', 'Восстановление... Не закрывайте страницу.');

    // Clear and restore each table
    if(data.daily_entries?.length){
      await sb.from('daily_entries').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('daily_entries').insert(data.daily_entries);
    }
    if(data.expenses?.length){
      await sb.from('expenses').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('expenses').insert(data.expenses);
    }
    if(data.salaries?.length){
      await sb.from('salaries').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('salaries').insert(data.salaries);
    }
    if(data.bank_transactions?.length){
      await sb.from('bank_transactions').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('bank_transactions').insert(data.bank_transactions);
    }
    await loadAll();
    showAlert('success', 'Данные успешно восстановлены из резервной копии!');
  }catch(err){
    showAlert('error', 'Ошибка восстановления: ' + err.message);
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────
const saved = sessionStorage.getItem('uchet_user');
if(saved){try{STATE.user=JSON.parse(saved);}catch{}}
STATE.loading=false;
render();
if(STATE.user) loadAll();
</script>
