<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Учёт Системы</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1a1d23;--bg2:#22262f;--bg3:#2a2f3a;--border:#363c4a;
  --accent:#f59e0b;--accent2:#f87171;--accent3:#34d399;
  --text:#f0f2f7;--text2:#b0bac8;--text3:#7a8499;
  --card:#22262f;--hover:#2e3342;
}
.light{
  --bg:#f0f2f7;--bg2:#ffffff;--bg3:#e8eaf0;--border:#d0d5e0;
  --text:#1a1e2e;--text2:#4a5568;--text3:#8892a4;
  --card:#ffffff;--hover:#f5f7fc;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;transition:background .3s,color .3s;}
.app{display:flex;min-height:100vh;}
.sidebar{width:250px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;}
.logo{padding:20px;border-bottom:1px solid var(--border);}
.logo h1{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;color:var(--accent);line-height:1.4;}
.logo p{font-size:10px;color:var(--text3);margin-top:4px;}
.nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-label{font-size:9px;font-weight:600;color:var(--text2);letter-spacing:.15em;text-transform:uppercase;padding:8px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;font-size:13px;color:var(--text2);transition:all .2s;}
.nav-item:hover{background:var(--hover);color:var(--text);}
.nav-item.active{background:var(--hover);color:var(--accent);border-left-color:var(--accent);font-weight:500;}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);}
.user-badge{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg3);border-radius:10px;}
.user-avatar{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000;flex-shrink:0;}
.user-info p{font-size:12px;font-weight:500;}
.user-info span{font-size:10px;color:var(--text3);}
.logout-btn{margin-left:auto;background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);}
.main{margin-left:250px;flex:1;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.topbar h2{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.content{padding:24px;flex:1;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;transition:all .2s;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#000;}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover:not(:disabled){background:var(--hover);}
.btn-danger{background:rgba(239,68,68,.1);color:var(--accent2);border:1px solid rgba(239,68,68,.2);}
.btn-success{background:rgba(16,185,129,.1);color:var(--accent3);border:1px solid rgba(16,185,129,.2);}
.theme-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:15px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;}
.stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.stat-value{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:700;}
.stat-value.y{color:var(--accent);}
.stat-value.g{color:var(--accent3);}
.stat-value.r{color:var(--accent2);}
.stat-value.b{color:#60a5fa;}
.stat-sub{font-size:10px;color:var(--text2);margin-top:4px;}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.table-card .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.table-head h3{font-size:13px;font-weight:600;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg3);}
thead th{padding:9px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;} thead th.num{text-align:right;}
tbody tr{border-top:1px solid var(--border);}
tbody tr:hover{background:var(--hover);}
tbody td{padding:10px 14px;font-size:13px;color:var(--text);vertical-align:middle;}
.txt-cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
thead th.num{text-align:right;}
.actions-cell{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-height:32px;}
.badge{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;}
.badge-y{background:rgba(245,158,11,.15);color:var(--accent);}
.badge-g{background:rgba(16,185,129,.15);color:var(--accent3);}
.badge-r{background:rgba(239,68,68,.15);color:var(--accent2);}
.badge-b{background:rgba(59,130,246,.15);color:#60a5fa;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:10px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.08em;}
.form-control{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .2s;} .form-control::placeholder{color:var(--text3);}
.form-control:focus{border-color:var(--accent);}
select.form-control option{background:var(--bg2);}
.section-title{font-family:'Unbounded',sans-serif;font-size:10px;font-weight:600;color:var(--text2);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:7px 14px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;background:var(--bg2);color:var(--text2);transition:all .2s;}
.tab:hover{color:var(--text);border-color:var(--accent);}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;}
.modal-body{padding:20px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);}
.close-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:13px;color:var(--text2);}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:14px;}
.alert-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--accent);}
.alert-success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--accent3);}
.alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--accent2);}
.profit-box{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(16,185,129,.02));border:1px solid rgba(16,185,129,.25);border-radius:12px;padding:20px;text-align:center;margin-bottom:18px;}
.profit-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;}
.profit-value{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:700;}
.profit-sub{font-size:10px;color:var(--text3);margin-top:4px;}
.bar-chart{display:flex;flex-direction:column;gap:10px;padding:14px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{font-size:11px;color:var(--text2);width:80px;flex-shrink:0;text-align:right;}
.bar-track{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .6s ease;}
.bar-val{font-size:11px;color:var(--text);width:90px;text-align:right;font-weight:500;}
.empty{text-align:center;padding:36px;color:var(--text3);font-size:13px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;}
.loading-screen p{color:var(--text3);font-size:13px;}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:36px;width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo h1{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;color:var(--accent);}
.login-logo p{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.1em;}
.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent3);margin-right:5px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.top-alert{position:fixed;top:16px;right:16px;z-index:999;min-width:260px;box-shadow:0 4px 20px rgba(0,0,0,.3);}

/* ── MOBILE ── */
.hamburger{display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:18px;align-items:center;justify-content:center;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;backdrop-filter:blur(2px);}
.sidebar-overlay.open{display:block;}
@media(max-width:768px){
  .hamburger{display:flex;}
  .sidebar{transform:translateX(-100%);transition:transform .3s;z-index:100;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .content{padding:14px;}
  .topbar{padding:10px 14px;}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{padding:14px;}
  .stat-value{font-size:15px;}

  /* Tables → card view on mobile */
  /* mobile-cards only on very small screens */

  .point-tabs,.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
  .tab,.point-tab{flex-shrink:0;}
  .form-grid{grid-template-columns:1fr;}
  .modal{margin:8px;max-height:95vh;}
  .profit-box .profit-value{font-size:20px;}
  .topbar h2{font-size:12px;}
  .btn{font-size:11px;padding:7px 12px;}
}
@media(max-width:480px){
  .hide-mobile{display:none;}
  .stats-grid{grid-template-columns:1fr;}
  .topbar-right .btn span{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://ejcsyiseajqvidrvnxbl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_euNwrhhUCWpF_q0jUHZmmw_I4Zbcd2X';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const POINTS = [
  {id:'mkr17',name:'17-й Микрорайон',short:'17 МКР'},
  {id:'mkr5', name:'5-й Микрорайон', short:'5 МКР'},
  {id:'baza', name:'База',           short:'База'},
  {id:'polf', name:'Полфабрикат',    short:'Полф.'},
  {id:'ofis', name:'Офис',           short:'Офис'},
];
const CATS = {
  mkr17:['Мясо','Курица','Баранина','Конина','Салаты','Полфабрикат','Маркет'],
  mkr5: ['Мясо','Курица','Баранина','Конина','Полфабрикат','Маркет'],
  baza: ['Мясо','Курица','Баранина','Конина'],
  polf: ['Полфабрикат'],
  ofis: [],
};
EXP_TYPES_DEFAULT = ['Аренда','Зарплата','Электричество','Транспорт','Коммунальные','Уборка','Упаковка','Ремонт','Прочее'];
function getExpTypes(){
  try{ const s=localStorage.getItem('exp_types'); return s?JSON.parse(s):EXP_TYPES_DEFAULT; }
  catch{return EXP_TYPES_DEFAULT;}
}
function saveExpTypes(arr){
  localStorage.setItem('exp_types', JSON.stringify(arr));
}
const PAGE_TITLES = {dashboard:'Главная панель',entry:'Ввод данных',expenses:'Расходы / Зарплаты',bank:'Банк (Офис)',report:'Отчёт',users:'Пользователи',profile:'Мой профиль',staff:'Персонал / Зарплаты',cariler:'Карточки должников'};

function fmt(n){if(!n&&n!==0)return '—';return Number(n).toLocaleString('ru-KZ')+'₸';}
function fmtDate(d){
  if(!d) return '—';
  const s = String(d).trim();
  // Already DD.MM.YYYY
  if(/^\d{2}\.\d{2}\.\d{4}$/.test(s)) return s;
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    const [y,m,day] = s.slice(0,10).split('-');
    return `${day}.${m}.${y}`;
  }
  return s;
}
function today(){return new Date().toISOString().split('T')[0];}
function getLast(n){const d=[];for(let i=n-1;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);d.push(x.toISOString().split('T')[0]);}return d;}

// ─── STATE ─────────────────────────────────────────────────────────────────
let STATE = {
  theme: localStorage.getItem('theme')||'dark',
  user: null,
  page: 'dashboard',
  loading: true,
  dataLoaded: false,
  entries: [],
  expenses: [],
  salaries: [],
  bankTx: [],
  alert: null,
  alertTimer: null,
};

function setState(patch){
  Object.assign(STATE, patch);
  render();
}

function showAlert(type, msg){
  if(STATE.alertTimer) clearTimeout(STATE.alertTimer);
  const t = setTimeout(()=>setState({alert:null,alertTimer:null}), 3500);
  setState({alert:{type,msg}, alertTimer:t});
}

// ─── SUPABASE ───────────────────────────────────────────────────────────────
async function loadAll(){
  setState({dataLoaded:false});
  try{
    const [e,ex,sal,bk,staff,adv,salPay] = await Promise.all([
      sb.from('daily_entries').select('*').order('date',{ascending:false}),
      sb.from('expenses').select('*').order('date',{ascending:false}),
      sb.from('salaries').select('*').order('created_at',{ascending:false}),
      sb.from('bank_transactions').select('*').order('created_at',{ascending:false}),
      sb.from('staff').select('*'),
      sb.from('staff_advances').select('*'),
      sb.from('staff_salary_payments').select('*'),
    ]);
    setState({entries:e.data||[], expenses:ex.data||[], salaries:sal.data||[], bankTx:bk.data||[],
      staffCache:staff.data||[], advancesCache:adv.data||[], salPayCache:salPay.data||[],
      dataLoaded:true});
  }catch(err){
    setState({dataLoaded:true});
    showAlert('error','Ошибка загрузки: '+err.message);
  }
}

async function doLogin(login, password){
  const {data,error} = await sb.from('users').select('*').eq('login',login).eq('password',password).single();
  if(error||!data) throw new Error('Неверный логин или пароль');
  sessionStorage.setItem('uchet_user', JSON.stringify(data));
  setState({user:data});
  await loadAll();
}

function doLogout(){
  sessionStorage.removeItem('uchet_user');
  setState({user:null, entries:[], expenses:[], salaries:[], bankTx:[], dataLoaded:false, page:'dashboard'});
}

function applyTheme(t){
  document.body.className = t==='light'?'light':'';
  localStorage.setItem('theme',t);
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  applyTheme(STATE.theme);
  const app = document.getElementById('app');
  if(!app) return;

  if(STATE.loading){
    app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><p>Загрузка...</p></div>`;
    return;
  }
  if(!STATE.user){
    app.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  if(!STATE.dataLoaded){
    app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><p>Загрузка данных...</p></div>`;
    return;
  }

  const accessPoints = STATE.user.role==='admin' ? POINTS : POINTS.filter(p=>p.id===STATE.user.point_id);

  app.innerHTML = `
    ${STATE.alert ? `<div class="top-alert alert alert-${STATE.alert.type}">${STATE.alert.msg}</div>` : ''}
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="app">
      ${renderSidebar(accessPoints)}
      <div class="main">
        ${renderTopbar()}
        <div class="content" id="page-content">
          ${renderPage(accessPoints)}
        </div>
      </div>
    </div>
  `;
  bindEvents(accessPoints);
}

// ─── LOGIN ──────────────────────────────────────────────────────────────────
function renderLogin(){
  return `
    <div class="login-screen">
      <div style="position:absolute;top:14px;right:14px;">
        <button class="theme-btn" id="theme-btn-login">${STATE.theme==='dark'?'☀️':'🌙'}</button>
      </div>
      <div class="login-card">
        <div class="login-logo">
          <h1>ISTANBUL ET MARKET</h1>
          <p>Управление точками продаж</p>
        </div>
        <div id="login-err"></div>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="form-group"><label>Логин</label><input class="form-control" id="login-input" placeholder="Введите логин" autocomplete="username"/></div>
          <div class="form-group"><label>Пароль</label><input class="form-control" type="password" id="pass-input" placeholder="Введите пароль" autocomplete="current-password"/></div>
          <button class="btn btn-primary" id="login-btn" style="justify-content:center;padding:11px;">Войти</button>
        </div>
        <div style="margin-top:14px;font-size:11px;color:var(--text3);text-align:center;"><span class="online-dot"></span>Подключено к облаку</div>
      </div>
    </div>
  `;
}

function bindLogin(){
  document.getElementById('theme-btn-login')?.addEventListener('click',()=>setState({theme:STATE.theme==='dark'?'light':'dark'}));
  const btn = document.getElementById('login-btn');
  const errDiv = document.getElementById('login-err');
  async function tryLogin(){
    const login = document.getElementById('login-input').value.trim();
    const pass  = document.getElementById('pass-input').value;
    if(!login||!pass) return;
    btn.disabled=true; btn.textContent='Вход...';
    try{ await doLogin(login,pass); }
    catch(e){
      errDiv.innerHTML=`<div class="alert alert-error">${e.message}</div>`;
      btn.disabled=false; btn.textContent='Войти';
    }
  }
  btn?.addEventListener('click', tryLogin);
  document.getElementById('pass-input')?.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
}

// ─── SIDEBAR ────────────────────────────────────────────────────────────────
function renderSidebar(accessPoints){
  const nav = [
    {id:'dashboard',icon:'📊',label:'Главная'},
    {id:'entry',icon:'📝',label:'Ввод данных'},
    {id:'expenses',icon:'💸',label:'Расходы / Зарплаты'},
    {id:'bank',icon:'🏦',label:'Банк (Офис)'},
    {id:'report',icon:'📈',label:'Отчёт'},
    ...(STATE.user.role==='admin'?[{id:'users',icon:'👥',label:'Пользователи'}]:[]),
    ...(STATE.user.role==='admin'?[{id:'staff',icon:'💼',label:'Персонал / Зарплаты'}]:[]),
    ...(['admin','operator'].includes(STATE.user.role)&&['mkr17','mkr5','baza',null].includes(STATE.user.point_id)?[{id:'cariler',icon:'📒',label:'Карточки должников'}]:[]),
    {id:'profile',icon:'👤',label:'Мой профиль'},
  ];
  const navItems = nav.map(n=>`
    <div class="nav-item ${STATE.page===n.id?'active':''}" data-page="${n.id}">
      <span>${n.icon}</span><span>${n.label}</span>
    </div>
  `).join('');
  const pts = accessPoints.map(p=>`<div class="nav-item" style="font-size:11px;"><span>📍</span><span>${p.name}</span></div>`).join('');
  const u = STATE.user;
  return `
    <div class="sidebar">
      <div class="logo">
        <h1>ISTANBUL ET MARKET</h1>

// ─── PAGES ──────────────────────────────────────────────────────────────────
function renderPage(accessPoints){
  switch(STATE.page){
    case 'dashboard': return renderDashboard(accessPoints);
    case 'entry':     return renderEntry(accessPoints);
    case 'expenses':  return renderExpenses(accessPoints);
    case 'bank':      return renderBank();
    case 'report':    return renderReport(accessPoints);
    case 'users':     return STATE.user.role==='admin' ? renderUsers() : '';
    case 'profile':   return renderProfile();
    case 'staff':     return STATE.user.role==='admin' ? renderStaff() : '';
    case 'cariler':   return renderCariler();
    default: return '';
  }
}

// ─── DASHBOARD ──────────────────────────────────────────────────────────────
function renderDashboard(accessPoints){
  const tod = today();
  const todE = STATE.entries.filter(e=>e.date===tod);
  const todEx = STATE.expenses.filter(e=>e.date===tod);

  // Check which points haven't entered data today
  const editablePts = accessPoints.filter(p=>p.id!=='ofis');
  const missingData = editablePts.filter(p=>{
    const ptCats = CATS[p.id]||[];
    if(ptCats.length===0) return false;
    const ptEntries = todE.filter(e=>e.point_id===p.id);
    return ptEntries.length===0; // No data at all today
  });
  const partialData = editablePts.filter(p=>{
    const ptCats = CATS[p.id]||[];
    if(ptCats.length===0) return false;
    const ptEntries = todE.filter(e=>e.point_id===p.id);
    return ptEntries.length>0 && ptEntries.length<ptCats.length;
  });
  const totSales = todE.reduce((s,e)=>s+Number(e.sold||0),0);
  const totPurch = todE.reduce((s,e)=>s+Number(e.received||0),0);
  const totRem   = todE.reduce((s,e)=>s+Number(e.remaining||0),0);
  const totExp   = todEx.reduce((s,e)=>s+Number(e.amount||0),0);
  const pts = accessPoints.filter(p=>p.id!=='ofis');
  const maxS = Math.max(...pts.map(p=>todE.filter(e=>e.point_id===p.id).reduce((s,e)=>s+Number(e.sold||0),0)),1);

  const bars = pts.map(p=>{
    const s = todE.filter(e=>e.point_id===p.id).reduce((x,e)=>x+Number(e.sold||0),0);
    return `<div class="bar-row"><div class="bar-label">${p.short}</div><div class="bar-track"><div class="bar-fill" style="width:${(s/maxS)*100}%"></div></div><div class="bar-val">${s>0?fmt(s):'—'}</div></div>`;
  }).join('');

  const rows = pts.map(p=>{
    const pe=todE.filter(e=>e.point_id===p.id);
    return `<tr><td class="txt-cut"><span class="badge badge-y">${p.name}</span></td><td class="num">${fmt(pe.reduce((s,e)=>s+Number(e.received||0),0))}</td><td class="num" style="color:var(--accent);font-weight:500;">${fmt(pe.reduce((s,e)=>s+Number(e.sold||0),0))}</td><td class="num" style="color:var(--accent3);">${fmt(pe.reduce((s,e)=>s+Number(e.remaining||0),0))}</td><td class="num">${pe.length}</td></tr>`;
  }).join('');

  return `
    ${missingData.length>0||partialData.length>0?`
    <div style="margin-bottom:16px;">
      ${missingData.length>0?`
      <div class="alert alert-error" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span style="font-size:18px;">⚠️</span>
        <div>
          <b>Данные не введены сегодня:</b>
          ${missingData.map(p=>`<span class="badge badge-r" style="margin-left:6px;">${p.name}</span>`).join('')}
        </div>
      </div>`:''}
      ${partialData.length>0?`
      <div class="alert alert-warn" style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:18px;">📝</span>
        <div>
          <b>Введены не все категории:</b>
          ${partialData.map(p=>{
            const entered = todE.filter(e=>e.point_id===p.id).length;
            const total = (CATS[p.id]||[]).length;
            return `<span class="badge badge-y" style="margin-left:6px;">${p.name} (${entered}/${total})</span>`;
          }).join('')}
        </div>
      </div>`:''}
    </div>`:''}
    <div class="section-title">Сегодня — ${fmtDate(tod)}</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Продажи</div><div class="stat-value y">${fmt(totSales)}</div><div class="stat-sub">все точки</div></div>
      <div class="stat-card"><div class="stat-label">Закуп</div><div class="stat-value b">${fmt(totPurch)}</div><div class="stat-sub">поступления</div></div>
      <div class="stat-card"><div class="stat-label">Расходы</div><div class="stat-value r">${fmt(totExp)}</div><div class="stat-sub">операционные</div></div>
      <div class="stat-card"><div class="stat-label">Остаток</div><div class="stat-value g">${fmt(totRem)}</div><div class="stat-sub">склад</div></div>
    </div>
    <div class="section-title">Продажи по точкам</div>
    <div class="table-card"><div class="bar-chart">${bars||'<div class="empty">Нет данных</div>'}</div></div>
    <div class="section-title">Расходы по точкам (сегодня)</div>
    <div class="table-card" style="margin-bottom:16px;">
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
        ${(()=>{
          const allPts = accessPoints.filter(p=>p.id!=="ofis");
          const maxExp = Math.max(...allPts.map(p=>todEx.filter(e=>e.point_id===p.id).reduce((s,e)=>s+Number(e.amount||0),0)),1);
          return allPts.map(p=>{
            const exp = todEx.filter(e=>e.point_id===p.id).reduce((s,e)=>s+Number(e.amount||0),0);
            const bar = (exp/maxExp)*100;
            return `<div style="display:flex;align-items:center;gap:10px;">
              <div style="width:80px;font-size:12px;color:var(--text);flex-shrink:0;">${p.short}</div>
              <div style="flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;">
                <div style="height:100%;width:${bar}%;background:var(--accent2);border-radius:4px;"></div>
              </div>
              <div style="width:90px;text-align:right;font-size:11px;color:var(--accent2);font-weight:600;">${exp>0?fmt(exp):'—'}</div>
            </div>`;
          }).join('');
        })()}
      </div>
    </div>
    <div class="section-title">Детали</div>
    <div class="table-card"><div class="table-scroll"><table style="table-layout:fixed;width:100%;"><colgroup><col style="width:30%"><col style="width:18%"><col style="width:18%"><col style="width:18%"><col style="width:16%"></colgroup><thead><tr><th>Точка</th><th class="num">Закуп</th><th class="num">Продажа</th><th class="num">Остаток</th><th class="num">Записей</th></tr></thead><tbody>${rows||'<tr><td colspan="5"><div class="empty">Нет данных за сегодня</div></td></tr>'}</tbody></table></div></div></div>
  `;
}

// ─── ENTRY PAGE ──────────────────────────────────────────────────────────────
let entryState = {pointId:'', date:today(), saving:false, modal:null, bulkMode:false, bulkData:{}};

function renderEntry(accessPoints){
  const editable = accessPoints.filter(p=>p.id!=='ofis');
  if(!entryState.pointId && editable[0]) entryState.pointId = editable[0].id;
  const cats = CATS[entryState.pointId]||[];
  const dayE = STATE.entries.filter(e=>e.point_id===entryState.pointId&&e.date===entryState.date);

  const tabsHtml = editable.map(p=>`<div class="tab ${entryState.pointId===p.id?'active':''}" data-entry-point="${p.id}">${p.name}</div>`).join('');

  const rows = cats.map(cat=>{
    const e=dayE.find(x=>x.category===cat);
    return `<tr style="cursor:pointer;" data-entry-cat="${cat}">
      <td class="txt-cut"><b>${cat}</b></td>
      <td class="num">${e?fmt(e.received):'<span style="color:var(--text3)">—</span>'}</td>
      <td class="num">${e?`<span style="color:var(--accent);font-weight:500;">${fmt(e.sold)}</span>`:'<span style="color:var(--text3)">—</span>'}</td>
      <td class="num">${e?`<span style="color:var(--accent3);">${fmt(e.remaining)}</span>`:'<span style="color:var(--text3)">—</span>'}</td>
      <td>${e?'<span class="badge badge-g">✓ Введено</span>':'<span class="badge badge-y">Ожидает</span>'}</td>
    </tr>`;
  }).join('');

  const totSales = dayE.reduce((s,e)=>s+Number(e.sold||0),0);
  const totPurch = dayE.reduce((s,e)=>s+Number(e.received||0),0);
  const totRem   = dayE.reduce((s,e)=>s+Number(e.remaining||0),0);

  // 30-day summary for selected point
  const last30 = getLast(30);
  const ptE30 = STATE.entries.filter(e=>e.point_id===entryState.pointId&&last30.includes(e.date));
  const sum30S = ptE30.reduce((s,e)=>s+Number(e.sold||0),0);
  const sum30P = ptE30.reduce((s,e)=>s+Number(e.received||0),0);
  const cats30 = CATS[entryState.pointId]||[];
  const lastRem30 = cats30.reduce((total,cat)=>{
    const last = ptE30.filter(e=>e.category===cat).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return total+(last?Number(last.remaining||0):0);
  },0);
  const ptExp30 = STATE.expenses.filter(e=>e.point_id===entryState.pointId&&last30.includes(e.date)).reduce((s,e)=>s+Number(e.amount||0),0);
  const ptStaffIds = (STATE.staffCache||[]).filter(emp=>emp.point_id===entryState.pointId).map(e=>e.id);
  const ptSal30 = [...(STATE.advancesCache||[]),...(STATE.salPayCache||[])].filter(x=>ptStaffIds.includes(x.employee_id)&&last30.includes(x.date)).reduce((s,e)=>s+Number(e.amount||0),0);
  const profit30 = sum30S - sum30P - ptExp30 - ptSal30 + lastRem30;

  const modalHtml = entryState.modal ? renderEntryModal() : '';

  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn ${entryState.bulkMode?'btn-primary':'btn-ghost'}" 
        onclick="entryState.bulkMode=!entryState.bulkMode;if(!entryState.bulkMode)entryState.bulkData={};render();"
        style="font-size:12px;">
        ${entryState.bulkMode?'✕ Отмена':'⚡ Быстрый ввод (все категории)'}
      </button>
    </div>
    <div class="stats-grid" style="margin-bottom:16px;">
      <div class="stat-card">
        <div class="stat-label">Продажа (30 дней)</div>
        <div class="stat-value y">${fmt(sum30S)}</div>
        <div class="stat-sub">${POINTS.find(p=>p.id===entryState.pointId)?.name}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Закуп (30 дней)</div>
        <div class="stat-value b">${fmt(sum30P)}</div>
        <div class="stat-sub">поступления товара</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Остаток склада</div>
        <div class="stat-value g">${fmt(lastRem30)}</div>
        <div class="stat-sub">последние данные</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Расходы (30 дней)</div>
        <div class="stat-value r">${fmt(ptExp30+ptSal30)}</div>
        <div class="stat-sub">опер. + зарплаты</div>
      </div>
      <div class="stat-card" style="border-color:${profit30>=0?'rgba(16,185,129,.3)':'rgba(239,68,68,.3)'};">
        <div class="stat-label">Прибыль (30 дней)</div>
        <div class="stat-value" style="color:${profit30>=0?'var(--accent3)':'var(--accent2)'};">${fmt(profit30)}</div>
        <div class="stat-sub">Продажа−Закуп−Расх+Остаток</div>
      </div>
    </div>
    <div class="tabs">${tabsHtml}</div>
    <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;">
      <div class="form-group" style="margin:0;">
        <label>Дата</label>
        <input type="date" class="form-control" id="entry-date" value="${entryState.date}" style="width:170px;"/>
      </div>
      <span style="font-size:12px;color:var(--text3);margin-bottom:2px;">Введено: ${dayE.length} из ${cats.length}</span>
    </div>
    ${entryState.bulkMode?`
    <div class="table-card" style="padding:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="font-family:'Unbounded',sans-serif;font-size:12px;">⚡ Быстрый ввод — ${POINTS.find(p=>p.id===entryState.pointId)?.name}</h3>
      </div>
      <div style="display:grid;gap:10px;">
        ${cats.map(cat=>{
          const e=dayE.find(x=>x.category===cat);
          const bd=entryState.bulkData[cat]||{};
          return `<div style="background:var(--bg3);border-radius:10px;padding:12px;">
            <div style="font-weight:600;font-size:13px;margin-bottom:8px;">${cat} ${e?'<span class="badge badge-g">✓</span>':''}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
              <div class="form-group" style="margin:0;"><label>Закуп</label>
                <input type="number" class="form-control" value="${bd.received!==undefined?bd.received:e?e.received:''}" placeholder="${e?e.received:'0'}"
                  oninput="if(!entryState.bulkData['${cat}'])entryState.bulkData['${cat}']={};entryState.bulkData['${cat}'].received=this.value;"/></div>
              <div class="form-group" style="margin:0;"><label>Продажа</label>
                <input type="number" class="form-control" value="${bd.sold!==undefined?bd.sold:e?e.sold:''}" placeholder="${e?e.sold:'0'}"
                  oninput="if(!entryState.bulkData['${cat}'])entryState.bulkData['${cat}']={};entryState.bulkData['${cat}'].sold=this.value;"/></div>
              <div class="form-group" style="margin:0;"><label>Остаток</label>
                <input type="number" class="form-control" value="${bd.remaining!==undefined?bd.remaining:e?e.remaining:''}" placeholder="${e?e.remaining:'0'}"
                  oninput="if(!entryState.bulkData['${cat}'])entryState.bulkData['${cat}']={};entryState.bulkData['${cat}'].remaining=this.value;"/></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="entryState.bulkMode=false;entryState.bulkData={};render();">Отмена</button>
        <button class="btn btn-primary" id="bulk-save-btn" style="padding:10px 24px;">💾 Сохранить всё</button>
      </div>
    </div>`:`
    <div class="table-card">
      <div class="table-head"><h3>${POINTS.find(p=>p.id===entryState.pointId)?.name} — ${fmtDate(entryState.date)}</h3><span style="font-size:11px;color:var(--text3);">Нажмите строку</span></div>
      <table style="table-layout:fixed;width:100%;"><colgroup><col style="width:32%"><col style="width:17%"><col style="width:17%"><col style="width:17%"><col style="width:17%"></colgroup><thead><tr><th>Категория</th><th class="num">Закуп</th><th class="num">Продажа</th><th class="num">Остаток</th><th>Статус</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5"><div class="empty">Нет категорий</div></td></tr>'}</tbody></table>
    </div>`}
    ${dayE.length>0?`
    <div class="stats-grid" style="margin-top:14px;">
      <div class="stat-card"><div class="stat-label">Продажа</div><div class="stat-value y">${fmt(totSales)}</div></div>
      <div class="stat-card"><div class="stat-label">Закуп</div><div class="stat-value b">${fmt(totPurch)}</div></div>
      <div class="stat-card"><div class="stat-label">Остаток</div><div class="stat-value g">${fmt(totRem)}</div></div>
    </div>`:''}
    ${modalHtml}
  `;
}

// ─── EXPENSES ────────────────────────────────────────────────────────────────
// expState.pointId — выбранная точка; expState.tab — expenses|salaries
let expState = {tab:'expenses', pointId:'', modal:null, salModal:null, manageCats:false, editModal:null, editSalModal:null, filterDate:'', filterType:''};

function renderExpenses(accessPoints){
  // Init selected point — operator auto-gets their own point
  if(!expState.pointId){
    expState.pointId = STATE.user.role==='operator' ? (STATE.user.point_id||accessPoints[0]?.id||'') : (accessPoints[0]?.id||'');
  }
  if(!accessPoints.find(p=>p.id===expState.pointId)) expState.pointId = accessPoints[0]?.id||'';

  // Filter by selected point
  const selPoint = expState.pointId;
  const visExp = STATE.expenses.filter(e=>{
    if(e.point_id!==selPoint) return false;
    if(expState.filterDate && !e.date?.startsWith(expState.filterDate)) return false;
    if(expState.filterType && e.type!==expState.filterType) return false;
    return true;
  });
  const totExp = visExp.reduce((s,e)=>s+Number(e.amount||0),0);
  // Salary costs come from Staff module only
  const ptStaff = (STATE.staffCache||[]).filter(emp=>emp.point_id===selPoint).map(e=>e.id);
  const ptAdvances = (STATE.advancesCache||[]).filter(a=>ptStaff.includes(a.employee_id));
  const ptSalPays = (STATE.salPayCache||[]).filter(p=>ptStaff.includes(p.employee_id));
  const totSal = [...ptAdvances,...ptSalPays].reduce((s,e)=>s+Number(e.amount||0),0);

  // Point summary cards (all points)
  const allPtCards = accessPoints.map(p=>{
    const pExp = STATE.expenses.filter(e=>e.point_id===p.id).reduce((s,e)=>s+Number(e.amount||0),0);
    const pStaffIds = (STATE.staffCache||[]).filter(emp=>emp.point_id===p.id).map(e=>e.id);
    const pSal = [...(STATE.advancesCache||[]).filter(a=>pStaffIds.includes(a.employee_id)),
                  ...(STATE.salPayCache||[]).filter(sp=>pStaffIds.includes(sp.employee_id))]
                 .reduce((s,e)=>s+Number(e.amount||0),0);
    const isActive = p.id===selPoint;
    return `<div class="stat-card" style="cursor:pointer;border-color:${isActive?'var(--accent)':'var(--border)'};" data-exp-point="${p.id}">
      <div class="stat-label">${p.name}</div>
      <div class="stat-value r" style="font-size:15px;">${fmt(pExp+pSal)}</div>
      <div class="stat-sub">Расх: ${fmt(pExp)} · Зарп: ${fmt(pSal)}</div>
    </div>`;
  }).join('');

  const expRows = visExp.map(e=>`<tr>
    <td class="txt-cut">${fmtDate(e.date)}</td>
    <td class="txt-cut">${e.type}</td>
    <td class="num" style="color:var(--accent2);font-weight:500;">${fmt(e.amount)}</td>
    <td class="txt-cut" style="color:var(--text3);">${e.description||'—'}</td>
    <td>
      <div class="actions-cell">

// ─── BANK ────────────────────────────────────────────────────────────────────
function renderBank(){
  // Get unique categories and firms for filter dropdowns
  const allCats = [...new Set(STATE.bankTx.map(t=>t.category).filter(Boolean))].sort();
  const allFirms = [...new Set(STATE.bankTx.map(t=>t.doc_no).filter(Boolean))].sort();

  // Apply filters
  const bk = STATE.bankTx.filter(t=>{
    if(bankFilter.dateFrom && String(t.date)<bankFilter.dateFrom) return false;
    if(bankFilter.dateTo   && String(t.date)>bankFilter.dateTo)   return false;
    if(bankFilter.category && t.category!==bankFilter.category)   return false;
    if(bankFilter.firm     && t.doc_no!==bankFilter.firm)         return false;
    if(bankFilter.counterpart && !String(t.counterpart||'').toLowerCase().includes(bankFilter.counterpart.toLowerCase())) return false;
    if(bankFilter.txType==='debit'  && !(Number(t.debit)>0))  return false;
    if(bankFilter.txType==='credit' && !(Number(t.credit)>0)) return false;
    return true;
  });
  const allBk = STATE.bankTx;
  const totC = bk.reduce((s,t)=>s+Number(t.credit||0),0);
  const totD = bk.reduce((s,t)=>s+Number(t.debit||0),0);
  const rows = bk.map(t=>`<tr>
    <td class="txt-cut" style="font-size:11px;color:var(--text3);">${t.doc_no||'—'}</td>
    <td style="font-size:12px;white-space:nowrap;">${fmtDate(t.date)}</td>
    <td class="num" style="color:var(--accent2);font-weight:500;">${Number(t.debit)>0?fmt(t.debit):'—'}</td>

    <td>${t.approved?'<span class="badge badge-g">✓ Принято</span>':'<span class="badge badge-y">Ожидает</span>'}</td>
    <td style="display:flex;gap:4px;">
      ${!t.approved&&STATE.user.role==='admin'?`<button class="btn btn-success" style="padding:2px 7px;font-size:10px;" data-approve-tx="${t.id}">✓</button>`:''}
      ${STATE.user.role==='admin'?`<button class="btn btn-danger" style="padding:2px 7px;font-size:10px;" data-del-tx="${t.id}">✕</button>`:''}
    </td>
  </tr>`).join('');
  return `

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;">

            onchange="bankFilter.dateFrom=this.value;render();"/>
        </div>
        <div class="form-group" style="margin:0;">
          <label>📅 Дата по</label>
          <input type="date" class="form-control" value="${bankFilter.dateTo}"
            onchange="bankFilter.dateTo=this.value;render();"/>
        </div>
        <div class="form-group" style="margin:0;">
          <label>🏢 Фирма</label>
          <select class="form-control" onchange="bankFilter.firm=this.value;render();">
            <option value="">Все фирмы</option>
            ${allFirms.map(f=>`<option value="${f}" ${f===bankFilter.firm?'selected':''}>${f}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label>🏷️ Категория</label>

      ${(bankFilter.dateFrom||bankFilter.dateTo||bankFilter.category||bankFilter.firm||bankFilter.counterpart||bankFilter.txType)?`

      <p style="color:var(--text3);font-size:11px;margin-bottom:14px;">Формат: Дата | Описание | Приход | Расход</p>
      <label class="btn btn-primary" style="cursor:pointer;">📤 Выбрать файл Excel<input type="file" id="bank-file-input" accept=".xlsx,.xls" style="display:none;"/></label>
    </div>
    <div class="table-card"><div class="table-head"><h3>Банковские операции</h3></div>
    <div class="table-scroll" style="overflow-x:auto;"><table style="table-layout:fixed;min-width:800px;width:100%;">

  `;
}

// ─── REPORT ──────────────────────────────────────────────────────────────────
let reportState = {pointId:'', days:'15', tab:'report'}; // tab: report | compare

function renderReport(accessPoints){
  const editable = accessPoints.filter(p=>p.id!=='ofis');
  if(!reportState.pointId) reportState.pointId = 'ALL';
  const dates = getLast(Number(reportState.days));
  const isAll = reportState.pointId === 'ALL';

  // Per-point summary for consolidated view
  const pointSummary = editable.map(p=>{
    const pCats = CATS[p.id]||[];
    const pEntries = STATE.entries.filter(e=>e.point_id===p.id&&dates.includes(e.date));
    const pS = pEntries.reduce((s,e)=>s+Number(e.sold||0),0);
    const pR = pEntries.reduce((s,e)=>s+Number(e.received||0),0);
    const pRem = pCats.map(cat=>{
      const last = pEntries.filter(e=>e.category===cat).sort((a,b)=>b.date.localeCompare(a.date))[0];
      return last?Number(last.remaining||0):0;
    }).reduce((s,v)=>s+v,0);
    const pExp = STATE.expenses.filter(e=>e.point_id===p.id&&dates.includes(e.date)).reduce((s,e)=>s+Number(e.amount||0),0);
    const pSal = STATE.salaries.filter(s=>s.point_id===p.id).reduce((s,e)=>s+Number(e.amount||0),0);
    const pCosts = pExp+pSal;
    const pProfit = pS-pR-pCosts+pRem;
    const pMargin = pS>0?((pProfit/pS)*100).toFixed(1):'0.0';
    return {p, pS, pR, pRem, pCosts, pExp, pSal, pProfit, pMargin};
  });

  // Category data — for single point or all points merged
  const activePts = isAll ? editable : editable.filter(p=>p.id===reportState.pointId);
  const allCats = [...new Set(activePts.flatMap(p=>CATS[p.id]||[]))];
  const cats = isAll ? allCats : (CATS[reportState.pointId]||[]);

  const catData = cats.map(cat=>{
    const ce = STATE.entries.filter(e=>activePts.some(p=>p.id===e.point_id)&&e.category===cat&&dates.includes(e.date));
    const totR = ce.reduce((s,e)=>s+Number(e.received||0),0);
    const totS = ce.reduce((s,e)=>s+Number(e.sold||0),0);
    const lastRem = activePts.reduce((sum,p)=>{
      const last = ce.filter(e=>e.point_id===p.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
      return sum+(last?Number(last.remaining||0):0);
    },0);
    return {cat, totR, totS, lastRem, count:ce.length};
  });

  const totSold   = catData.reduce((s,c)=>s+c.totS,0);
  const totBought = catData.reduce((s,c)=>s+c.totR,0);
  const totRem    = catData.reduce((s,c)=>s+c.lastRem,0);
  const ptExp = isAll
    ? STATE.expenses.filter(e=>dates.includes(e.date)&&editable.some(p=>p.id===e.point_id))
    : STATE.expenses.filter(e=>e.point_id===reportState.pointId&&dates.includes(e.date));
  // Salary costs come from staff module (advances + payments)
  // Load from Supabase synchronously via pre-loaded data
  const ptStaffIds = (STATE.staffCache||[])
    .filter(emp=>isAll ? editable.some(p=>p.id===emp.point_id) : emp.point_id===reportState.pointId)
    .map(emp=>emp.id);
  const ptAdvances = (STATE.advancesCache||[])
    .filter(a=>ptStaffIds.includes(a.employee_id)&&dates.includes(a.date));
  const ptSalPayments = (STATE.salPayCache||[])
    .filter(p=>ptStaffIds.includes(p.employee_id)&&dates.includes(p.date));
  const totExp = ptExp.reduce((s,e)=>s+Number(e.amount||0),0);
  const totSal = [...ptAdvances,...ptSalPayments].reduce((s,e)=>s+Number(e.amount||0),0);
  const totCosts = totExp+totSal;
  const profit = totSold-totBought-totCosts+totRem;
  const marginPct = totSold>0 ? ((profit/totSold)*100).toFixed(1) : '0.0';
  const costPct   = totSold>0 ? (((totBought+totCosts)/totSold)*100).toFixed(1) : '0.0';

  const tabs = [
    `<div class="tab ${isAll?'active':''}" data-report-point="ALL">🌐 Все точки</div>`,
    ...editable.map(p=>`<div class="tab ${reportState.pointId===p.id&&!isAll?'active':''}" data-report-point="${p.id}">${p.name}</div>`)
  ].join('');

  // Consolidated point-by-point table (only shown for ALL)
  const consolidatedRows = isAll ? pointSummary.map(({p,pS,pR,pRem,pCosts,pProfit,pMargin})=>`
    <tr>
      <td class="txt-cut"><span class="badge badge-y">${p.name}</span></td>
      <td class="num" style="color:#60a5fa;font-weight:500;">${fmt(pR)}</td>
      <td class="num" style="color:var(--accent);font-weight:500;">${fmt(pS)}</td>
      <td class="num" style="color:var(--accent3);">${fmt(pRem)}</td>
      <td class="num" style="color:var(--accent2);">${fmt(pCosts)}</td>
      <td class="num" style="color:${Number(pProfit)>=0?'var(--accent3)':'var(--accent2)'};font-weight:700;">${fmt(pProfit)}</td>
      <td class="num" style="color:${Number(pMargin)>=0?'var(--accent3)':'var(--accent2)'};font-weight:700;">${pMargin}%</td>
    </tr>`).join('') : '';

  const consolidatedSection = isAll ? `
    <div class="section-title">Сводная таблица по точкам</div>
    <div class="table-card" style="margin-bottom:20px;">
      <div class="table-head"><h3>📍 Все точки — сравнение</h3></div>
      <div class="table-scroll" style="overflow-x:auto;">
      <table style="table-layout:fixed;min-width:650px;width:100%;"><colgroup><col style="width:25%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:13%"><col style="width:10%"></colgroup><thead><tr><th>Точка</th><th class="num">Закуп</th><th class="num">Продажа</th><th class="num">Остаток</th><th class="num">Расходы</th><th class="num">Прибыль</th><th class="num">Рент-сть</th></tr></thead>
        <tbody>
          ${consolidatedRows}
          <tr style="background:var(--bg3);font-weight:700;border-top:2px solid var(--accent);">
            <td>ИТОГО ВСЕ</td>
            <td class="num" style="color:#60a5fa;">${fmt(totBought)}</td>
            <td class="num" style="color:var(--accent);">${fmt(totSold)}</td>
            <td class="num" style="color:var(--accent3);">${fmt(totRem)}</td>
            <td class="num" style="color:var(--accent2);">${fmt(totCosts)}</td>

    </div>
    <div class="table-card" style="margin-bottom:20px;">
      <div class="table-head"><h3>📊 Продажи по точкам</h3></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
        ${pointSummary.sort((a,b)=>b.pS-a.pS).map(({p,pS})=>{

    <div class="table-card" style="margin-bottom:20px;">

        ${pointSummary.sort((a,b)=>b.pProfit-a.pProfit).map(({p,pProfit,pMargin})=>{

  const expRows = [
    ...ptExp.map(e=>`<tr><td>${fmtDate(e.date)}</td><td><span class="badge badge-r">${e.type}</span></td><td class="num" style="color:var(--accent2);">${fmt(e.amount)}</td><td class="txt-cut" style="color:var(--text3);">${e.description||'—'}</td></tr>`),

  window._lastReportData = {catData,totSold,totBought,totRem,totExp,totSal,totCosts,profit,dates,
    pointId:reportState.pointId,
    pointSummary:pointSummary.map(x=>({name:x.p.name,pS:x.pS,pR:x.pR,pRem:x.pRem,pCosts:x.pCosts,pProfit:x.pProfit,pMargin:x.pMargin}))
  };

  // Comparison data (current month vs previous month)
  const now = new Date();
  const curMonth  = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const prevDate  = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevMonth = `${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,'0')}`;
  
  function getMonthData(month, ptIds){
    const mDates = STATE.entries.filter(e=>e.date.startsWith(month)).map(e=>e.date);
    const uniq = [...new Set(mDates)];
    const mEntries = STATE.entries.filter(e=>ptIds.includes(e.point_id)&&e.date.startsWith(month));
    const mExp = STATE.expenses.filter(e=>ptIds.includes(e.point_id)&&e.date.startsWith(month));
    const mStaffIds = (STATE.staffCache||[]).filter(emp=>ptIds.includes(emp.point_id)).map(e=>e.id);
    const mSal = [...(STATE.advancesCache||[]),...(STATE.salPayCache||[])]
      .filter(x=>mStaffIds.includes(x.employee_id)&&x.date?.startsWith(month));
    const sold = mEntries.reduce((s,e)=>s+Number(e.sold||0),0);
    const bought = mEntries.reduce((s,e)=>s+Number(e.received||0),0);
    const allCatsM = [...new Set(activePts.flatMap(p=>CATS[p.id]||[]))];
    const rem = allCatsM.reduce((total,cat)=>{
      const last = mEntries.filter(e=>e.category===cat).sort((a,b)=>b.date.localeCompare(a.date))[0];
      return total+(last?Number(last.remaining||0):0);
    },0);
    const exp = mExp.reduce((s,e)=>s+Number(e.amount||0),0);
    const sal = mSal.reduce((s,e)=>s+Number(e.amount||0),0);
    const profit = sold-bought-(exp+sal)+rem;
    return {sold,bought,rem,exp:exp+sal,profit, days:uniq.length};
  }

  const ptIds = activePts.map(p=>p.id);
  const curData  = getMonthData(curMonth,  ptIds);
  const prevData = getMonthData(prevMonth, ptIds);

  function diff(cur,prev){
    if(!prev) return null;
    const pct = ((cur-prev)/Math.abs(prev||1)*100).toFixed(1);
    const up = cur>=prev;
    return `<span style="font-size:11px;color:${up?'var(--accent3)':'var(--accent2)'};">

          <tr><td><b>Расходы</b></td><td class="num" style="color:var(--accent2);">${fmt(prevData.exp)}</td><td class="num" style="color:var(--accent2);">${fmt(curData.exp)}</td><td class="num">${fmt(curData.exp-prevData.exp)}</td><td class="num">${diff(curData.exp,prevData.exp)||'—'}</td></tr>
          <tr style="background:var(--bg3);font-weight:700;"><td><b>Прибыль</b></td>
            <td class="num" style="color:${prevData.profit>=0?'var(--accent3)':'var(--accent2)'};">${fmt(prevData.profit)}</td>
            <td class="num" style="color:${curData.profit>=0?'var(--accent3)':'var(--accent2)'};">${fmt(curData.profit)}</td>
            <td class="num">${fmt(curData.profit-prevData.profit)}</td>
            <td class="num">${diff(curData.profit,prevData.profit)||'—'}</td>
          </tr>
        </tbody>
      </table></div>
    </div>

    ${isAll?`
    <div class="section-title">По точкам — сравнение</div>
    ${editable.map(p=>{
      const cur  = getMonthData(curMonth,  [p.id]);
      const prev = getMonthData(prevMonth, [p.id]);
      return `<div class="table-card" style="margin-bottom:12px;">
        <div class="table-head"><h3>📍 ${p.name}</h3></div>
        <div style="padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;">
          <div class="stat-card" style="padding:12px;">
            <div class="stat-label">Продажа</div>
            <div style="font-size:12px;color:var(--text2);">${prevMonth}: ${fmt(prev.sold)}</div>
            <div style="font-size:15px;font-weight:700;color:var(--accent);">${fmt(cur.sold)}</div>
            <div>${diff(cur.sold,prev.sold)||'—'}</div>
          </div>
          <div class="stat-card" style="padding:12px;">
            <div class="stat-label">Расходы</div>
            <div style="font-size:12px;color:var(--text2);">${prevMonth}: ${fmt(prev.exp)}</div>
            <div style="font-size:15px;font-weight:700;color:var(--accent2);">${fmt(cur.exp)}</div>
            <div>${diff(cur.exp,prev.exp)||'—'}</div>
          </div>
          <div class="stat-card" style="padding:12px;border-color:${cur.profit>=0?'rgba(16,185,129,.3)':'rgba(239,68,68,.3)'};">
            <div class="stat-label">Прибыль</div>
            <div style="font-size:12px;color:var(--text2);">${prevMonth}: ${fmt(prev.profit)}</div>
            <div style="font-size:15px;font-weight:700;color:${cur.profit>=0?'var(--accent3)':'var(--accent2)'};">${fmt(cur.profit)}</div>
            <div>${diff(cur.profit,prev.profit)||'—'}</div>
          </div>
        </div>
      </div>`;
    }).join('')}`:''}
    `:''}

    ${reportState.tab==='report'?`

      <div class="form-group" style="margin:0;"><label>Период</label>
        <select class="form-control" id="report-days" style="width:130px;">

      <div class="profit-value" style="color:${profit>=0?'var(--accent3)':'var(--accent2)'};">${fmt(profit)}</div>

        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:28px;font-family:'Unbounded',sans-serif;font-weight:700;color:${profit>=0?'var(--accent3)':'var(--accent2)'};">${marginPct}%</span>

          <div>📦 Себестоимость: <b style="color:var(--accent2);">${costPct}%</b> от продаж</div>
          <div>📅 Период: ${fmtDate(dates[0])} — ${fmtDate(dates[dates.length-1])}</div>

    </div>
    <div class="stats-grid" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-label">Продажа</div><div class="stat-value y">${fmt(totSold)}</div></div>
      <div class="stat-card"><div class="stat-label">Закуп</div><div class="stat-value b">${fmt(totBought)}</div></div>
      <div class="stat-card"><div class="stat-label">Остаток</div><div class="stat-value g">${fmt(totRem)}</div></div>
      <div class="stat-card"><div class="stat-label">Расходы</div><div class="stat-value r">${fmt(totCosts)}</div></div>

    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-head"><h3>📊 Продажи по категориям</h3></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
        ${catData.filter(c=>c.totS>0).sort((a,b)=>b.totS-a.totS).map(c=>{
          const pct = totSold>0?((c.totS/totSold)*100).toFixed(1):'0';
          const bar = totSold>0?((c.totS/totSold)*100):0;
          return `<div style="display:flex;align-items:center;gap:10px;">
            <div style="width:90px;font-size:12px;color:var(--text);flex-shrink:0;">${c.cat}</div>
            <div style="flex:1;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;">
              <div style="height:100%;width:${bar}%;background:var(--accent);border-radius:5px;transition:width .6s;"></div>

        }).join('')||'<div class="empty">Нет данных о продажах</div>'}
      </div>
    </div>

    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-head"><h3>📦 Закуп по категориям</h3></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
        ${catData.filter(c=>c.totR>0).sort((a,b)=>b.totR-a.totR).map(c=>{
          const pct = totBought>0?((c.totR/totBought)*100).toFixed(1):'0';
          const bar = totBought>0?((c.totR/totBought)*100):0;
          return `<div style="display:flex;align-items:center;gap:10px;">
            <div style="width:90px;font-size:12px;color:var(--text);flex-shrink:0;">${c.cat}</div>
            <div style="flex:1;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;">
              <div style="height:100%;width:${bar}%;background:#60a5fa;border-radius:5px;transition:width .6s;"></div>
            </div>

            <div style="width:100px;text-align:right;font-size:11px;color:var(--text2);">${fmt(c.totR)}</div>
          </div>`;
        }).join('')||'<div class="empty">Нет данных о закупе</div>'}

    </div>

    <div class="table-card"><div class="table-scroll"><table style="table-layout:fixed;min-width:620px;width:100%;"><colgroup><col style="width:25%"><col style="width:15%"><col style="width:15%"><col style="width:15%"><col style="width:15%"><col style="width:15%"></colgroup><thead><tr><th>Категория</th><th class="num">Закуп</th><th class="num">Продажа</th><th class="num">Остаток</th><th class="num">Дней</th><th class="num">Рент-сть</th></tr></thead>
      <tbody>
        ${catData.map(c=>{
          const cm = c.totS>0?(((c.totS-c.totR)/c.totS)*100).toFixed(1):'—';
          return `<tr>
            <td><b>${c.cat}</b></td>
            <td class="num" style="color:#60a5fa;">${fmt(c.totR)}</td>
            <td class="num" style="color:var(--accent);">${fmt(c.totS)}</td>
            <td class="num" style="color:var(--accent3);">${fmt(c.lastRem)}</td>
            <td class="num"><span class="badge badge-b">${c.count}</span></td>
            <td class="num" style="color:${Number(cm)>=0?'var(--accent3)':'var(--accent2)'};font-weight:600;">${cm!=='—'?cm+'%':'—'}</td>
          </tr>`;
        }).join('')||'<tr><td colspan="6"><div class="empty">Нет данных</div></td></tr>'}
        <tr style="background:var(--bg3);font-weight:600;">
          <td>ИТОГО</td>
          <td class="num" style="color:#60a5fa;">${fmt(totBought)}</td>
          <td class="num" style="color:var(--accent);">${fmt(totSold)}</td>
          <td class="num" style="color:var(--accent3);">${fmt(totRem)}</td>
          <td class="num">—</td>
          <td class="num" style="color:${profit>=0?'var(--accent3)':'var(--accent2)'};">${marginPct}%</td>
        </tr>
      </tbody>
    </table></div></div>
    <div class="section-title">Расходы за период</div>
    <div class="table-card"><div class="table-scroll"><table style="table-layout:fixed;width:100%;"><colgroup><col style="width:15%"><col style="width:20%"><col style="width:15%"><col style="width:50%"></colgroup><thead><tr><th>Дата/Период</th><th>Тип</th><th class="num">Сумма</th><th>Описание</th></tr></thead>
      <tbody>${expRows||'<tr><td colspan="4"><div class="empty">Нет расходов</div></td></tr>'}</tbody>
    </table></div></div></div></div>
    `:''}  
  `;
}

function exportExcel(d){
  const isAll = d.pointId==='ALL';
  const pt = isAll ? 'Все точки' : (POINTS.find(p=>p.id===d.pointId)?.name||d.pointId);
  const rows = [
    ['ISTANBUL ET MARKET — Отчёт',pt,'Период',`${d.dates[0]} — ${d.dates[d.dates.length-1]}`],[],
  ];
  if(isAll && d.pointSummary){
    rows.push(['СВОДКА ПО ТОЧКАМ']);
    rows.push(['Точка','Закуп','Продажа','Остаток','Расходы','Прибыль','Рент-сть %']);
    d.pointSummary.forEach(p=>rows.push([p.name,p.pR,p.pS,p.pRem,p.pCosts,p.pProfit,p.pMargin+'%']));
    rows.push([]);
  }
  rows.push(['КАТЕГОРИИ']);
  rows.push(['Категория','Закуп','Продажа','Остаток','Дней','Рентабельность %']);
  d.catData.forEach(c=>rows.push([c.cat,c.totR,c.totS,c.lastRem,c.count,c.totS>0?(((c.totS-c.totR)/c.totS)*100).toFixed(1)+'%':'—']));
  rows.push([]);
  rows.push(['Итого Продажа',d.totSold],['Итого Закуп',d.totBought],['Итого Остаток',d.totRem],
    ['Операц. расходы',d.totExp],['Зарплаты',d.totSal],['Итого расходы',d.totCosts]);
  rows.push([],['ПРИБЫЛЬ',d.profit],['Рентабельность %',d.totSold>0?((d.profit/d.totSold)*100).toFixed(1)+'%':'0%']);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Отчёт');
  XLSX.writeFile(wb,`Otchet_${d.pointId}_${d.dates[0]}.xlsx`);
}

function exportPDF(d){
  const isAll = d.pointId==='ALL';
  const pt = isAll ? 'Все точки' : (POINTS.find(p=>p.id===d.pointId)?.name||d.pointId);
  const marginPct = d.totSold>0?((d.profit/d.totSold)*100).toFixed(1):'0.0';
  const w = window.open('','_blank');
  const ptRows = (isAll && d.pointSummary) ? d.pointSummary.map(p=>`<tr><td>${p.name}</td><td>${p.pR.toLocaleString()}</td><td>${p.pS.toLocaleString()}</td><td>${p.pRem.toLocaleString()}</td><td>${p.pCosts.toLocaleString()}</td><td style="color:${Number(p.pProfit)>=0?'green':'red'}">${p.pProfit.toLocaleString()}</td><td>${p.pMargin}%</td></tr>`).join('') : '';
  const rows = d.catData.map(c=>`<tr><td>${c.cat}</td><td>${c.totR.toLocaleString()}</td><td>${c.totS.toLocaleString()}</td><td>${c.lastRem.toLocaleString()}</td><td>${c.totS>0?(((c.totS-c.totR)/c.totS)*100).toFixed(1)+'%':'—'}</td></tr>`).join('');

// ─── BIND EVENTS ─────────────────────────────────────────────────────────────
function bindEvents(accessPoints){
  // Hamburger menu
  document.getElementById('hamburger-btn')?.addEventListener('click',()=>{
    document.querySelector('.sidebar')?.classList.toggle('open');
    document.getElementById('sidebar-overlay')?.classList.toggle('open');
  });

    document.querySelector('.sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('open');
  });
  // Close sidebar on nav click (mobile)
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelector('.sidebar')?.classList.remove('open');
      document.getElementById('sidebar-overlay')?.classList.remove('open');
    });
  });

  // Backup / Restore
  document.getElementById('backup-btn')?.addEventListener('click', downloadBackup);
  document.getElementById('restore-file')?.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) restoreBackup(file);
    e.target.value='';
  });

  // Theme
  document.getElementById('theme-btn')?.addEventListener('click',()=>setState({theme:STATE.theme==='dark'?'light':'dark'}));
  // Refresh
  document.getElementById('refresh-btn')?.addEventListener('click',()=>loadAll());
  // Logout
  document.getElementById('logout-btn')?.addEventListener('click',doLogout);
  // Nav
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>setState({page:el.dataset.page}));
  });

  // Bulk save
  document.getElementById('bulk-save-btn')?.addEventListener('click', async()=>{
    const cats = CATS[entryState.pointId]||[];
    const toSave = cats.filter(cat=>entryState.bulkData[cat]&&
      Object.values(entryState.bulkData[cat]).some(v=>v!==''));
    if(toSave.length===0){showAlert('error','Нет данных для сохранения');return;}
    const btn=document.getElementById('bulk-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    let saved=0, errors=0;
    for(const cat of toSave){
      const bd = entryState.bulkData[cat];
      const existing = STATE.entries.find(e=>e.point_id===entryState.pointId&&e.date===entryState.date&&e.category===cat);
      const data = {
        point_id:entryState.pointId, date:entryState.date, category:cat,
        received:Number(bd.received||existing?.received||0),
        sold:Number(bd.sold||existing?.sold||0),
        remaining:Number(bd.remaining||existing?.remaining||0),
        user_id:STATE.user.id
      };
      let err;
      if(existing){
        const r=await sb.from('daily_entries').update({received:data.received,sold:data.sold,remaining:data.remaining,updated_at:new Date().toISOString()}).eq('id',existing.id);
        err=r.error;
      } else {
        const r=await sb.from('daily_entries').insert(data);
        err=r.error;
      }
      if(err) errors++;
      else saved++;
    }
    if(errors>0) showAlert('error',`Ошибок: ${errors}, сохранено: ${saved}`);
    else showAlert('success',`Сохранено ${saved} категорий!`);
    entryState.bulkMode=false;
    entryState.bulkData={};
    await loadAll();
  });

  // Entry page
  document.querySelectorAll('[data-entry-point]').forEach(el=>{
    el.addEventListener('click',()=>{entryState.pointId=el.dataset.entryPoint;render();});
  });
  document.getElementById('entry-date')?.addEventListener('change',e=>{entryState.date=e.target.value;render();});
  document.querySelectorAll('[data-entry-cat]').forEach(el=>{
    el.addEventListener('click',()=>{
      const cat=el.dataset.entryCat;
      const existing=STATE.entries.find(e=>e.point_id===entryState.pointId&&e.date===entryState.date&&e.category===cat);
      entryState.modal={cat, existing, received:existing?.received||'', sold:existing?.sold||'', remaining:existing?.remaining||'', note:existing?.note||''};
      render();
    });
  });
  document.getElementById('entry-modal-close')?.addEventListener('click',()=>{entryState.modal=null;render();});
  document.getElementById('entry-modal-close2')?.addEventListener('click',()=>{entryState.modal=null;render();});
  document.getElementById('entry-modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='entry-modal-overlay'){entryState.modal=null;render();}});
  document.getElementById('entry-save-btn')?.addEventListener('click',async()=>{
    const received=Number(document.getElementById('m-received').value)||0;
    const sold=Number(document.getElementById('m-sold').value)||0;
    const remaining=Number(document.getElementById('m-remaining').value)||0;
    const note=document.getElementById('m-note').value;
    const cat=entryState.modal.cat;
    const btn=document.getElementById('entry-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    const exists=STATE.entries.find(e=>e.point_id===entryState.pointId&&e.date===entryState.date&&e.category===cat);
    let err;
    if(exists){
      const r=await sb.from('daily_entries').update({received,sold,remaining,note,updated_at:new Date().toISOString()}).eq('id',exists.id);
      err=r.error;
    } else {
      const r=await sb.from('daily_entries').insert({point_id:entryState.pointId,date:entryState.date,category:cat,received,sold,remaining,note,user_id:STATE.user.id});

    await loadAll();

  // Expenses

  // Category management

  document.getElementById('new-cat-input')?.addEventListener('keydown',e=>{

  document.querySelectorAll('[data-del-cat]').forEach(el=>{
    el.addEventListener('click',()=>{
      const types = getExpTypes();
      const idx = Number(el.dataset.delCat);

  document.getElementById('add-exp-btn')?.addEventListener('click',()=>{expState.modal={};render();});
  document.getElementById('exp-modal-close')?.addEventListener('click',()=>{expState.modal=null;render();});
  document.getElementById('exp-modal-close2')?.addEventListener('click',()=>{expState.modal=null;render();});
  document.getElementById('exp-modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='exp-modal-overlay'){expState.modal=null;render();}});
  document.getElementById('exp-save-btn')?.addEventListener('click',async()=>{

    btn.disabled=true;btn.textContent='Сохранение...';

  document.getElementById('edit-exp-close')?.addEventListener('click',()=>{expState.editModal=null;render();});
  document.getElementById('edit-exp-close2')?.addEventListener('click',()=>{expState.editModal=null;render();});
  document.getElementById('edit-exp-overlay')?.addEventListener('click',e=>{if(e.target.id==='edit-exp-overlay'){expState.editModal=null;render();}});
  document.getElementById('edit-exp-save')?.addEventListener('click',async()=>{

      type: document.getElementById('edit-exp-type').value,

    else{showAlert('success','Расход обновлён');expState.editModal=null;await loadAll();}
  });

  document.querySelectorAll('[data-del-exp]').forEach(el=>{
    el.addEventListener('click',async()=>{
      if(!confirm('Удалить расход?')) return;
      await sb.from('expenses').delete().eq('id',el.dataset.delExp);
      await loadAll();
    });
  });
  // Salary UI moved to Staff module

  // Bank
  document.getElementById('bank-file-input')?.addEventListener('change',async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1});
        // Parse bank Excel file
        // Find header row automatically
        let headerRowIdx = -1;
        for(let i=0;i<Math.min(rows.length,10);i++){
          const row = rows[i]||[];
          const rowStr = row.map(c=>String(c||'').toLowerCase()).join('|');
          if(rowStr.includes('дебет')||rowStr.includes('кредит')||rowStr.includes('дата опер')){
            headerRowIdx = i;
            break;
          }
        }
        if(headerRowIdx<0) headerRowIdx=1; // fallback to row 2

        const header = (rows[headerRowIdx]||[]).map(h=>String(h||'').toLowerCase().trim());

        const col = (keywords) => {
          for(const kw of keywords){
            const i = header.findIndex(h=>h.includes(kw));
            if(i>=0) return i;
          }
          return -1;
        };

        const iFirma  = col(['фирма','firma','компания']);
        const iDate   = col(['дата опера','дата опер','дата','date']);
        const iDebit  = col(['дебет','debit']);
        const iCredit = col(['кредит','credit']);
        const iName   = col(['наименование','отправител','бенефициар']);
        const iPurp   = col(['назначение','платеж','purpose']);
        const iCat    = col(['категория','category']);

        const dataRows = rows.slice(headerRowIdx+1);

        const newTx = dataRows.filter(r=>Array.isArray(r)&&r.some(c=>c!=null&&c!=='')).map(r=>{
          const getVal = (idx, fallback) => {
            if(idx>=0 && idx<r.length) return r[idx];
            if(fallback>=0 && fallback<r.length) return r[fallback];
            return '';
          };
          const debitRaw  = String(getVal(iDebit,  3)||'').replace(/\s/g,'').replace(',','.').replace(/[^0-9.]/g,'');
          const creditRaw = String(getVal(iCredit, 4)||'').replace(/\s/g,'').replace(',','.').replace(/[^0-9.]/g,'');
          const debit  = parseFloat(debitRaw)||0;
          const credit = parseFloat(creditRaw)||0;
          if(!debit && !credit) return null;
          return {
            doc_no:      String(getVal(iFirma, 0)||''),
            date:        String(getVal(iDate,  2)||''),
            debit,
            credit,
            counterpart: String(getVal(iName,  5)||''),
            purpose:     String(getVal(iPurp, 10)||''),
            category:    String(getVal(iCat,  12)||''),
            description: String(getVal(iName,  5)||''),
            source_file: file.name,
            approved:    false,
          };
        }).filter(r=>r!==null);
        if(!newTx.length){showAlert('error','Нет данных в файле');return;}
        const {error}=await sb.from('bank_transactions').insert(newTx);
        if(error){showAlert('error',error.message);}else{showAlert('success',`Загружено ${newTx.length} операций`);await loadAll();}
      }catch(err){showAlert('error','Ошибка файла: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
    e.target.value='';
  });
  document.querySelectorAll('[data-approve-tx]').forEach(el=>{
    el.addEventListener('click',async()=>{await sb.from('bank_transactions').update({approved:true,approved_by:STATE.user.id}).eq('id',el.dataset.approveTx);await loadAll();});
  });
  document.querySelectorAll('[data-del-tx]').forEach(el=>{
    el.addEventListener('click',async()=>{await sb.from('bank_transactions').delete().eq('id',el.dataset.delTx);await loadAll();});
  });

  // Report — export buttons
  document.getElementById('export-excel-btn')?.addEventListener('click',()=>{
    if(window._lastReportData) exportExcel(window._lastReportData);
    else showAlert('error','Нет данных для экспорта');
  });
  document.getElementById('export-pdf-btn')?.addEventListener('click',()=>{
    if(window._lastReportData) exportPDF(window._lastReportData);
    else showAlert('error','Нет данных для экспорта');
  });

  // Report — point tabs
  document.querySelectorAll('[data-report-point]').forEach(el=>{
    el.addEventListener('click',()=>{reportState.pointId=el.dataset.reportPoint;render();});
  });
  document.getElementById('report-days')?.addEventListener('change',e=>{reportState.days=e.target.value;render();});

  // Staff page
  document.getElementById('add-emp-btn')?.addEventListener('click',()=>{staffModal={};render();});
  document.getElementById('staff-modal-close')?.addEventListener('click',()=>{staffModal=null;render();});
  document.getElementById('staff-modal-close2')?.addEventListener('click',()=>{staffModal=null;render();});
  document.getElementById('staff-modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='staff-modal-overlay'){staffModal=null;render();}});
  document.getElementById('emp-save-btn')?.addEventListener('click',async()=>{
    const d={
      name:document.getElementById('emp-name').value.trim(),
      position:document.getElementById('emp-position').value.trim(),
      point_id:document.getElementById('emp-point').value||null,
      monthly_salary:Number(document.getElementById('emp-salary').value)||0,
      phone:document.getElementById('emp-phone').value.trim(),
      hire_date:document.getElementById('emp-hire').value,
    };

  document.getElementById('adv-save-btn')?.addEventListener('click',async()=>{
    const d={
      employee_id:advanceModal.id,
      date:document.getElementById('adv-date').value,
      amount:Number(document.getElementById('adv-amount').value)||0,
      note:document.getElementById('adv-note').value,
    };
    if(!d.amount){showAlert('error','Укажите сумму');return;}
    const btn=document.getElementById('adv-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    const {error}=await sb.from('staff_advances').insert(d);
    if(error){showAlert('error',error.message);btn.disabled=false;btn.textContent='Сохранить';}
    else{showAlert('success','Аванс записан');advanceModal=null;staffLoaded=false;render();}
  });

  // Salary payment modal
  document.querySelectorAll('[data-salpay-emp]').forEach(el=>{
    el.addEventListener('click',()=>{salPayModal={id:el.dataset.salpayEmp,name:el.dataset.salpayName};render();});
  });
  document.getElementById('salpay-close')?.addEventListener('click',()=>{salPayModal=null;render();});
  document.getElementById('salpay-close2')?.addEventListener('click',()=>{salPayModal=null;render();});
  document.getElementById('salpay-modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='salpay-modal-overlay'){salPayModal=null;render();}});
  document.getElementById('salpay-save-btn')?.addEventListener('click',async()=>{
    const d={
      employee_id:salPayModal.id,
      date:document.getElementById('salpay-date').value,
      amount:Number(document.getElementById('salpay-amount').value)||0,
      note:document.getElementById('salpay-note').value,
    };
    if(!d.amount){showAlert('error','Укажите сумму');return;}
    const btn=document.getElementById('salpay-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    const {error}=await sb.from('staff_salary_payments').insert(d);
    if(error){showAlert('error',error.message);btn.disabled=false;btn.textContent='Сохранить';}
    else{showAlert('success','Зарплата выдана');salPayModal=null;staffLoaded=false;render();}
  });

  // Cariler — new debtor
  document.getElementById('caril-save-btn')?.addEventListener('click',async()=>{
    const d={
      name:document.getElementById('c-name').value.trim(),
      phone:document.getElementById('c-phone').value.trim(),
      total_debt:Number(document.getElementById('c-debt').value)||0,
      date:document.getElementById('c-date').value,
      description:document.getElementById('c-desc').value.trim(),
      point_id:carilerPoint,
    };
    if(!d.name||!d.total_debt){showAlert('error','Заполните имя и сумму долга');return;}
    const btn=document.getElementById('caril-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    const {error}=await sb.from('debtors').insert(d);
    if(error){showAlert('error',error.message);btn.disabled=false;btn.textContent='Добавить';}
    else{showAlert('success','Должник добавлен');carilerModal=null;carilerLoaded=false;render();}
  });

  // Cariler — record payment
  document.getElementById('pay-save-btn')?.addEventListener('click',async()=>{
    const d={
      debtor_id:paymentModal.id,
      date:document.getElementById('pay-date').value,
      amount:Number(document.getElementById('pay-amount').value)||0,
      note:document.getElementById('pay-note').value,
    };

    if(d.amount>paymentModal.remaining+0.01){
      if(!confirm('Сумма превышает остаток долга. Продолжить?')) return;
    }
    const btn=document.getElementById('pay-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    const {error}=await sb.from('debtor_payments').insert(d);
    if(error){showAlert('error',error.message);btn.disabled=false;btn.textContent='Сохранить';}
    else{showAlert('success','Оплата записана');paymentModal=null;carilerLoaded=false;render();}
  });

  // Profile page — change own password
  document.getElementById('prof-save-pass')?.addEventListener('click', async()=>{
    const curPass = document.getElementById('cur-pass').value;
    const newPass = document.getElementById('prof-new-pass').value;
    const newPass2 = document.getElementById('prof-new-pass2').value;
    const alertDiv = document.getElementById('profile-alert');
    if(!curPass||!newPass||!newPass2){alertDiv.innerHTML='<div class="alert alert-error">Заполните все поля</div>';return;}
    if(newPass!==newPass2){alertDiv.innerHTML='<div class="alert alert-error">Пароли не совпадают</div>';return;}
    if(newPass.length<4){alertDiv.innerHTML='<div class="alert alert-error">Минимум 4 символа</div>';return;}
    if(curPass!==STATE.user.password){alertDiv.innerHTML='<div class="alert alert-error">Неверный текущий пароль</div>';return;}
    const btn=document.getElementById('prof-save-pass');
    btn.disabled=true;btn.textContent='Сохранение...';

    if(error){
      alertDiv.innerHTML=`<div class="alert alert-error">${error.message}</div>`;
      btn.disabled=false;btn.textContent='🔑 Изменить пароль';
    } else {
      STATE.user.password=newPass;
      sessionStorage.setItem('uchet_user',JSON.stringify(STATE.user));
      alertDiv.innerHTML='<div class="alert alert-success">✓ Пароль успешно изменён!</div>';
      btn.disabled=false;btn.textContent='🔑 Изменить пароль';

      document.getElementById('prof-new-pass').value='';
      document.getElementById('prof-new-pass2').value='';

  document.getElementById('add-user-btn')?.addEventListener('click',()=>{userModal=true;render();});

  document.getElementById('user-modal-close2')?.addEventListener('click',()=>{userModal=false;render();});
